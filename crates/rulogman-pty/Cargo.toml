[package]
name = "rulogman-pty"
version.workspace = true
edition.workspace = true
license.workspace = true

# Shared by both backends: the outbound event stream, the lock that guards it,
# and the logging. Everything platform-specific is gated below, so a build for
# a target with neither pty flavor still compiles the config and event types.
[dependencies]
rulogman-stream.workspace = true
futures.workspace = true
log.workspace = true
parking_lot.workspace = true

# The unix pty itself — `openpty`, `setsid`, controlling-terminal setup, and the
# macOS detour through `/usr/bin/login` — already exists inside alacritty's
# `tty` module, which the workspace depends on for terminal emulation anyway.
# Reusing it keeps the fiddly parts in one well-tested place.
[target.'cfg(unix)'.dependencies]
alacritty_terminal.workspace = true

# Undoing the non-blocking mode alacritty forces on the master, and reading the
# passwd entry when `$SHELL` is unset.
libc.workspace = true

# The Windows pty. See the note by `portable-pty` in the workspace manifest for
# why alacritty's own ConPTY backend is not the one used here.
[target.'cfg(windows)'.dependencies]
portable-pty.workspace = true
# Reading the process table, to tell whether the shell has started anything:
# Windows has no foreground process group to ask instead. Pinned to the same
# 0.62 gpui already links, so this adds no second copy of the bindings.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
