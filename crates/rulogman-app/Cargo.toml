[package]
name = "rulogman-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "rulogman"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Two callers, both of them Windows-only behaviour the rest of the tree has no
# equivalent of: `src/caption.rs` colours the DWM title bar from the app theme,
# and `src/files/local.rs` asks the kernel which drive letters exist so the file
# panel can offer them. `windows` is pinned to the same 0.61 gpui already links,
# so this adds no second copy of the bindings to the tree; `raw-window-handle`
# is how gpui hands out the `HWND`.
#
# `windows-registry` is the one registry consumer in the tree: after a
# self-update `src/update.rs` corrects the `DisplayVersion` in the uninstall
# entry the Inno installer wrote, so that winget still recognises the installed
# copy. It is picked over `winreg` for the same reason as `windows` above — gpui
# already links this exact crate at this exact version, so it costs an edge in
# the dependency graph rather than a crate in the build, whereas `winreg`
# appears today only as a *build*-dependency of `embed-resource` and would drag
# a second registry binding, and its own `windows-sys`, into the linked binary.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
] }
windows-registry = "0.5"
raw-window-handle = "0.6"

[dependencies]
rulogman-core.workspace = true
# The local-shell transport, behind `src/session.rs`'s local target. Not gated
# on a platform any more: the crate carries a pty backend for unix and a ConPTY
# one for Windows behind one API, so the local target compiles everywhere the
# application does. What still differs is the shell it starts — the login shell
# on unix, one the user picks on Windows — and that lives in `src/session.rs`.
rulogman-pty.workspace = true
rulogman-ssh.workspace = true
rulogman-term.workspace = true
# The widget kit every view here is drawn with, and the theme layer behind it.
# Shared with the sibling database tools, which is why it is a repository of its
# own rather than a module; see the workspace manifest.
ruui.workspace = true

anyhow.workspace = true
async-trait.workspace = true
# Only for the file panel: the save dialog opens in the user's home directory,
# and a local session's browsing starts there. The configuration paths
# themselves live in `rulogman-core`.
directories.workspace = true
russh.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
# Read-only, and by one module: `src/editor/syntax/custom.rs` parses the
# language definitions in the `syntaxes` directory. See the workspace manifest
# for why YAML and why this fork of the reader.
serde_norway.workspace = true
uuid.workspace = true
parking_lot.workspace = true
# The document behind `src/editor/`. See the workspace manifest for why a rope
# and why those features.
ropey.workspace = true
unicode-segmentation.workspace = true
# Only for the file panel's "is this name too long to fit?" estimate. A CJK name
# takes twice the width of a Latin one at the same character count, so counting
# characters alone would miss exactly the names most likely to be cut off.
unicode-width.workspace = true
futures.workspace = true
gpui.workspace = true
# One call, in `main`: `gpui_platform::application()`. gpui's core no longer
# knows which windowing backend exists, so the façade is what links one in and
# hands back the `Application` the rest of `main` drives.
gpui_platform.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
# Only for `src/update.rs`, the one HTTPS request rulogman makes: the start-up
# query to the GitHub releases API. gpui's own `cx.http_client()` is a
# `NullHttpClient` unless the application installs one, and installing a real
# one to serve a single background request would be a much larger dependency.
ureq.workspace = true
# Only for `src/update.rs`: the SHA-256 the self-updater checks a downloaded
# release asset against. Already linked as the crypto backend of both `russh`
# and `ureq`'s `rustls`, so this is an edge in the graph rather than a crate in
# the build.
ring.workspace = true
# `src/editor_pane.rs` stages a file being opened or saved in a scratch
# directory: `FileSource` moves files between this machine and the source it
# browses, and has no call that hands over contents, so a load is a copy out
# followed by a read and a save is the mirror of it. Also used by the file
# panel's tests, which walk a real tree rather than mocking the filesystem out.
tempfile.workspace = true

[dev-dependencies]
# gpui's headless test platform, for the widget behaviour that only exists once
# an element tree is laid out and hit-tested -- hover-revealed controls, and
# which of two stacked hitboxes answers a press. Test-only: the binary links
# gpui without it.
gpui = { workspace = true, features = ["test-support"] }
