[package]
name = "rulogman-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "rulogman"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# One caller, and Windows-only behaviour the rest of the tree has no equivalent
# of: `src/files/local.rs` asks the kernel which drive letters exist so the file
# panel can offer them. `windows` is pinned to the same 0.61 gpui already links,
# so this adds no second copy of the bindings to the tree.
#
# The two other Windows-only consumers this crate used to have are gone with the
# code that had them: the DWM caption colouring and the registry write that
# corrects an installed copy's recorded version after a self-update are both
# `ruui-shell`'s now, and it declares `windows-registry` and
# `raw-window-handle` for itself.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dependencies]
rulogman-core.workspace = true
# The local-shell transport, behind `src/session.rs`'s local target. Not gated
# on a platform any more: the crate carries a pty backend for unix and a ConPTY
# one for Windows behind one API, so the local target compiles everywhere the
# application does. What still differs is the shell it starts — the login shell
# on unix, one the user picks on Windows — and that lives in `src/session.rs`.
rulogman-pty.workspace = true
rulogman-ssh.workspace = true
rulogman-term.workspace = true
# The widget kit every view here is drawn with, and the theme layer behind it.
# Shared with the sibling database tools, which is why it is a repository of its
# own rather than a module; see the workspace manifest.
ruui.workspace = true
# The text surface a file opens in, out of the same repository: `src/editor/`
# was rulogman's own copy of it until the widget grew a home the database tools
# could share. What is left here is the two halves the widget has no business
# knowing — which colours a *terminal* scheme implies (`src/editor_palette.rs`)
# and which languages this application ships (`src/languages.rs`).
ruui-editor.workspace = true
# The layer above the widgets, out of the same repository: the window that draws
# its own title bar, the self-updater and its dialog, the about box, the palette
# catalogues and their colour editor, the split-pane tree and the pieces a
# settings form is built out of. It knows nothing about rulogman — `main`
# injects the name, the version, the release endpoints, the payload, the words
# and the ignored-release tag before the first window opens.
ruui-shell.workspace = true

anyhow.workspace = true
async-trait.workspace = true
# Only for the file panel: the save dialog opens in the user's home directory,
# and a local session's browsing starts there. The configuration paths
# themselves live in `rulogman-core`.
directories.workspace = true
russh.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
parking_lot.workspace = true
# Only for the file panel's "is this name too long to fit?" estimate. A CJK name
# takes twice the width of a Latin one at the same character count, so counting
# characters alone would miss exactly the names most likely to be cut off.
unicode-width.workspace = true
futures.workspace = true
gpui.workspace = true
# One call, in `main`: `gpui_platform::application()`. gpui's core no longer
# knows which windowing backend exists, so the façade is what links one in and
# hands back the `Application` the rest of `main` drives.
gpui_platform.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
# `src/editor_pane.rs` stages a file being opened or saved in a scratch
# directory: `FileSource` moves files between this machine and the source it
# browses, and has no call that hands over contents, so a load is a copy out
# followed by a read and a save is the mirror of it. Also used by the file
# panel's tests, which walk a real tree rather than mocking the filesystem out.
tempfile.workspace = true

[dev-dependencies]
# Only for the SFTP end-to-end suite, which names the Docker image it builds
# after the SHA-256 of the Dockerfile describing it; see the workspace manifest.
ring.workspace = true
# gpui's headless test platform, for the widget behaviour that only exists once
# an element tree is laid out and hit-tested -- hover-revealed controls, and
# which of two stacked hitboxes answers a press. Test-only: the binary links
# gpui without it.
gpui = { workspace = true, features = ["test-support"] }
