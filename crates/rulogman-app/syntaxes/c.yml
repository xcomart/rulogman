# Shipped with rulogman. A file of the same name in the user's `syntaxes`
# directory replaces this one whole.
#
# Given up: a preprocessor directive is coloured as a variable, which is the
# nearest the token set gets to one, and its `<stdio.h>` argument is left
# plain. A `\` at the end of a string does not continue it onto the next line.
name: C
files:
  extensions: [c, h]
comment: "//"
block_comment: ["/*", "*/"]
strings:
  - quote: '"'
  - quote: "'"
variables: ["#"]
keywords:
  keyword: [alignas, alignof, auto, break, case, char, const, constexpr,
    continue, default, do, double, else, enum, extern, float, for, goto, if,
    inline, int, long, register, restrict, return, short, signed, sizeof,
    static, static_assert, struct, switch, typedef, typeof, union, unsigned,
    void, volatile, while]
  literal: ["true", "false", "NULL", "nullptr"]
