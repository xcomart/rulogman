# Shipped with rulogman. A file of the same name in the user's `syntaxes`
# directory replaces this one whole.
#
# Given up: `${...}` inside a template literal is part of the string rather
# than code, a regular expression literal (`/^a+/g`) is not a string, and JSX
# is drawn as the surrounding code. `.jsx` is left to whoever wants to define
# it, since the highlighting would be a lie either way.
name: JavaScript
files:
  extensions: [js, mjs, cjs]
  shebangs: [node]
comment: "//"
block_comment: ["/*", "*/"]
strings:
  - pair: ["`", "`"]
  - quote: '"'
  - quote: "'"
keywords:
  keyword: [as, async, await, break, case, catch, class, const, continue,
    debugger, default, delete, do, else, export, extends, finally, for, from,
    function, get, if, import, in, instanceof, let, new, of, return, set,
    static, super, switch, this, throw, try, typeof, var, void, while, with,
    yield]
  literal: ["true", "false", "null", "undefined", "NaN", "Infinity",
    "globalThis"]
