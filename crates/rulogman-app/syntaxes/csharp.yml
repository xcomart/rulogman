# Shipped with rulogman. A file of the same name in the user's `syntaxes`
# directory replaces this one whole.
#
# Given up: an interpolated string's `{...}` is part of the string and its `$`
# prefix is not, a verbatim `@"..."` string ends at the first `"` inside it,
# and an attribute in `[Brackets]` is left plain. A preprocessor directive is
# coloured as a variable.
name: C#
files:
  extensions: [cs, csx]
comment: "//"
block_comment: ["/*", "*/"]
strings:
  - pair: ['"""', '"""']
  - quote: '"'
  - quote: "'"
variables: ["#"]
keywords:
  keyword: [abstract, as, async, await, base, bool, break, byte, case, catch,
    char, checked, class, const, continue, decimal, default, delegate, do,
    double, dynamic, else, enum, event, explicit, extern, finally, fixed, float,
    for, foreach, get, goto, if, implicit, in, init, int, interface, internal,
    is, lock, long, nameof, namespace, new, object, operator, out, override,
    params, partial, private, protected, public, readonly, record, ref, return,
    sbyte, sealed, set, short, sizeof, stackalloc, static, string, struct,
    switch, this, throw, try, typeof, uint, ulong, unchecked, unsafe, ushort,
    using, var, virtual, void, volatile, when, where, while, yield]
  literal: ["true", "false", "null", "value"]
