# Shipped with rulogman. A file of the same name in the user's `syntaxes`
# directory replaces this one whole.
#
# Given up: an annotation is coloured as a variable, which is the nearest the
# token set gets to one, and a text block's `\` line continuation is not
# followed — the block ends at its closing `"""` whatever precedes it.
name: Java
files:
  extensions: [java]
comment: "//"
block_comment: ["/*", "*/"]
strings:
  - pair: ['"""', '"""']
  - quote: '"'
  - quote: "'"
variables: ["@"]
keywords:
  keyword: [abstract, assert, boolean, break, byte, case, catch, char, class,
    const, continue, default, do, double, else, enum, extends, final, finally,
    float, for, goto, if, implements, import, instanceof, int, interface, long,
    native, new, package, permits, private, protected, public,
    record, return, sealed, short, static, strictfp, super, switch,
    synchronized, this, throw, throws, transient, try, var, void, volatile,
    while, yield]
  literal: ["true", "false", "null"]
