# Shipped with rulogman. A file of the same name in the user's `syntaxes`
# directory replaces this one whole.
#
# Given up: an f-string's `{...}` interpolation is coloured as part of the
# string, and a `r`/`b`/`f` prefix is not drawn as part of the quote that
# follows it. A decorator is coloured as a variable, the nearest thing the
# token set has to one.
name: Python
files:
  extensions: [py, pyi, pyw]
  names: [SConstruct, SConscript]
  shebangs: [python, python3]
comment: "#"
strings:
  - pair: ['"""', '"""']
  - pair: ["'''", "'''"]
  - quote: '"'
  - quote: "'"
variables: ["@"]
keywords:
  keyword: [and, as, assert, async, await, break, case, class, continue, def,
    del, elif, else, except, finally, for, from, global, if, import, in, is,
    lambda, match, nonlocal, not, or, pass, raise, return, try, while, with,
    yield, cls, self]
  literal: ["True", "False", "None", "NotImplemented", "Ellipsis"]
