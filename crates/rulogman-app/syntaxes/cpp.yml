# Shipped with rulogman. A file of the same name in the user's `syntaxes`
# directory replaces this one whole.
#
# Given up: a raw string literal — `R"delim(...)delim"` — is read as an
# ordinary quote and ends at the first `"`, and a preprocessor directive is
# coloured as a variable. `.h` belongs to C, which is the safer guess for a
# header with nothing in its name to say otherwise.
name: C++
files:
  extensions: [cpp, cc, cxx, hpp, hh, hxx, ipp, tpp]
comment: "//"
block_comment: ["/*", "*/"]
strings:
  - quote: '"'
  - quote: "'"
variables: ["#"]
keywords:
  keyword: [alignas, alignof, auto, bool, break, case, catch, char, char8_t,
    char16_t, char32_t, class, co_await, co_return, co_yield, concept, const,
    consteval, constexpr, constinit, const_cast, continue, decltype, default,
    delete, do, double, dynamic_cast, else, enum, explicit, export, extern,
    final, float, for, friend, goto, if, inline, int, long, mutable, namespace,
    new, noexcept, operator, override, private, protected, public,
    reinterpret_cast, requires, return, short, signed, sizeof, static,
    static_assert, static_cast, struct, switch, template, this, thread_local,
    throw, try, typedef, typeid, typename, union, unsigned, using, virtual,
    void, volatile, wchar_t, while]
  literal: ["true", "false", "nullptr", "NULL"]
