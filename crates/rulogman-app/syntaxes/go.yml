# Shipped with rulogman. A file of the same name in the user's `syntaxes`
# directory replaces this one whole.
#
# Given up: a build constraint (`//go:build`) is an ordinary comment, and a
# rune literal shares the rule single quotes get everywhere else, so an
# unterminated one takes the rest of its line.
name: Go
files:
  extensions: [go]
comment: "//"
block_comment: ["/*", "*/"]
strings:
  - pair: ["`", "`"]
  - quote: '"'
  - quote: "'"
keywords:
  keyword: [any, append, bool, break, byte, cap, case, chan, clear, close,
    complex, complex64, complex128, const, continue, copy, default, defer,
    delete, else, error, fallthrough, float32, float64, for, func, go, goto,
    if, import, int, int8, int16, int32, int64, interface, len, make, map,
    max, min, new, package, panic, print, println, range, recover, return,
    rune, select, string, struct, switch, type, uint, uint8, uint16, uint32,
    uint64, uintptr, var]
  literal: ["true", "false", "nil", "iota"]
