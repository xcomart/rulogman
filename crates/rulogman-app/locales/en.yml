# Interface strings, compiled into the binary by `rust_i18n::i18n!` in
# `src/main.rs`. This file is the source of truth: every other locale mirrors
# its keys, and a key missing from a translation falls back to the value here.
#
# Not translated anywhere, on purpose: the "rulogman" wordmark itself, element
# ids, gpui key names, color scheme ids, and the `Cmd`/`Ctrl` modifier names.
_version: 1

# What this language calls itself, for the settings dialog's language list.
# Written in the language of this file and never translated into another one:
# a user who has landed in a language they cannot read has to be able to find
# their own in the list. Every locale file must define it — the list of shipped
# languages is derived from these files, and this key is what names each entry.
language:
  name: English

# Shared by more than one dialog.
common:
  cancel: Cancel
  save: Save
  close: Close
  # The confirming answer of a dialog that asks for one thing and names its own
  # subject in the prompt — where "Save" or "Connect" would be repeating what
  # the dialog already said. Two letters in English and a word in several other
  # languages, which is why it is a key rather than a literal.
  ok: OK
  # Drawn on the card of a color-scheme picker that has no colors of its own,
  # i.e. the entry standing for "keep whatever the global setting says".
  inherits: inherits

# The in-app dropdown menu, and the macOS menu bar below it. The two differ
# only in capitalization in English, but a translation may need to distinguish
# them, so they are separate keys.
menu:
  new_session: New session
  # Opens a second window of the running application, with tabs of its own —
  # not a second rulogman: the two windows share the settings, the profiles and
  # the one start-up update check. Directly under the new session because the
  # two are the same command at two sizes.
  new_window: New window
  # One row per saved dashboard, under the two rows above, in the order
  # the start screen lists them. `%{name}` is the dashboard's own name and
  # is never translated.
  open_dashboard: "Dashboard: %{name}"
  # The macOS menu-bar menu listing the same dashboards, by name alone.
  dashboards: Dashboards
  # Splits the focused pane and opens a *second* connection to the same host in
  # the new half — a new session, not a view of the existing one. The same
  # wording labels the matching rows of the tab context menu, which is in
  # sentence case too.
  duplicate_right: Split right with a new connection
  duplicate_below: Split below with a new connection
  # Gives every column of the focused tab the same width, and every row the same
  # height. Directly under the splits, because they are what makes the command
  # worth having: a third pane comes out half the width of the first. Only the
  # dividers along the one axis move, so evening the widths leaves a stacked
  # pair inside a column where it was. Grayed on a tab with no divider of that
  # direction to move. The same wording labels the matching rows of the tab
  # context menu, which is in sentence case too.
  equalize_widths: Even out column widths
  equalize_heights: Even out row heights
  # Moves the focused pane of a split tab out into a tab of its own. Also the
  # label of the matching row in the tab context menu, which is in sentence case
  # too.
  break_out_pane: Move pane to its own tab
  # Moves the right-clicked tab — the active one, from the application menu
  # — out of this window and into a window of its own, sessions and splits
  # intact: nothing is disconnected on the way over. Under the pane
  # break-out because it is the same command a size up. A window's only tab
  # cannot go, since moving it would leave the window it left empty.
  tab_to_window: Move tab to new window
  settings: Settings…
  about: About rulogman
  # Both the in-app row and the macOS menu-bar item, and also the title of the
  # dialog it opens — so no trailing ellipsis, which would read oddly as a
  # heading.
  check_updates: Check for updates
  quit: Quit
  session: Session
  # Hover label of the button that opens this menu. Named after the menu it
  # opens rather than described, the way the tab strip's own buttons are.
  tip_menu: Menu
  mac:
    new_session: New Session
    new_window: New Window
    close_session: Close Session
    duplicate_right: Split Right with a New Connection
    duplicate_below: Split Below with a New Connection
    equalize_widths: Even Out Column Widths
    equalize_heights: Even Out Row Heights
    break_out_pane: Move Pane to Its Own Tab
    tab_to_window: Move Tab to New Window
    quit: Quit rulogman

# The menu a right-click on a tab opens. "Current tab" is the active one, which
# a right-click deliberately leaves as it is: the `split_*` commands attach the
# clicked tab to the tab already on screen, and the `duplicate_*` ones — offered
# on the active tab itself — connect afresh instead of moving anything.
tab:
  split_right: Split right of current tab
  split_below: Split below current tab
  duplicate_right: Split right with a new connection
  duplicate_below: Split below with a new connection
  # Captures a dashboard tab's current arrangement — which pane sits where and
  # where every divider was dragged — back onto the dashboard it was opened
  # from, so the next run restores it. Shown only on a dashboard tab, the only
  # tab with a dashboard to save to.
  save_layout: Save layout to dashboard
  # The first row of the menu a right-click on a followed file's header
  # opens, under which the colors the header can be painted in are
  # listed by the names the color scheme editor gives them. This row
  # takes the color away again, back to the theme's own strip.
  header_color_default: Default color
  # The last row of the header's color menu, which asks for a color of the
  # user's own in a small dialog of its own, titled and worded below.
  header_color_custom: "Custom…"
  header_color_custom_title: "Custom header color"
  header_color_custom_hint: "Pick a color, or type it as #RRGGBB."
  # The palette a header can be painted from, in the order it is listed.
  color:
    red: "Red"
    orange: "Orange"
    yellow: "Yellow"
    green: "Green"
    teal: "Teal"
    blue: "Blue"
    purple: "Purple"
    pink: "Pink"
    gray: "Gray"
  # Adds one more followed file to the tab that was right-clicked, in a pane
  # below the one in focus — the row that lets a dashboard tab be composed by
  # hand before `save_layout` above writes it back. One row per file per saved
  # connection, so both halves have to be named: `%{file}` is the last
  # component of the path and `%{connection}` the name of the connection it is
  # reached over, and neither is ever translated. The dash only separates them;
  # a language that would rather join them with a word should.
  add_tail: "Add %{file} — %{connection}"
  # Opens a second connection to the same host in a tab of its own, next to the
  # clicked one. The tab-sized twin of the `duplicate_*` rows above, so it says
  # the same thing they do about what appears: a new connection, not a view of
  # the existing one.
  duplicate: Duplicate tab
  close: Close tab
  # The two bulk closes, offered beneath `close`. Both are worded from the
  # clicked tab: the one that was clicked is the one that survives.
  close_others: Close other tabs
  close_right: Close tabs to the right
  # Hover labels for the two buttons at the end of the tab strip. The close
  # button on each tab reuses `close` above: same command, same wording.
  tip_list: All tabs
  tip_new: "New session (%{shortcut})"
  # Hover label of the mark on a tab whose session is holding its profile's
  # port forwardings open. `rules` is a comma-separated list already written as
  # `8080 → db:5432`, so the wording only has to say what is happening to them.
  # Only one tab per rule ever carries the mark: opening the same profile twice
  # leaves the second tab's listeners unbound, and unmarked.
  tip_tunnels: "Forwarding %{rules}"

# The file panel: the browser to the left of the terminal. Over an SSH session
# it browses the server through SFTP; over a session running a shell on this
# computer it browses this computer, and the keys below are worded for the
# former. The `local:` block near the end holds the twins of the ones that
# would be wrong for the latter — see the comment there.
#
# `%{name}` is a file name, `%{path}` a local path and `%{error}` the sentence
# the filesystem layer produced; all three are values rather than words and stay
# as they are. Only the sentence framing `%{error}` is translated, the same
# policy the connection and session messages follow. `%{percent}`, `%{count}`,
# `%{files}` and `%{folders}` are plain numbers.
files:
  title: Remote files
  # The row of the in-app dropdown menu that shows and hides the panel, and its
  # macOS menu bar counterpart. They differ only in capitalization in English,
  # like the `menu` pair above.
  #
  # Deliberately neutral, unlike `title`: there is one panel and one command
  # for it whichever session happens to be active, so this names the panel
  # rather than what is currently in it. The same goes for the two keys below.
  toggle: Files
  # Hover label of the toolbar button that shows and hides the panel. It
  # carries the shortcut because the dropdown row for the same command does,
  # and on macOS — where there is no in-app menu — the tooltip is the only
  # place the binding can be read at all.
  tip_toggle: "Files (%{shortcut})"
  mac:
    toggle: Files
  no_session: No session is open.
  not_connected: The remote files appear once the session is connected.
  loading: Loading…
  empty: This directory is empty.
  # Confirmation button of the platform file picker for an upload. Two of them,
  # because no platform picker offers files and folders in one dialog: Windows
  # and the Linux portal both switch a picker into folder mode rather than
  # widening it, so the panel asks with two buttons instead.
  select_upload: Upload
  select_upload_folder: Upload folder
  # Confirmation button of the folder picker that asks where a multi-entry
  # download should land. Only a destination is being chosen — the entries keep
  # the names they have on the server — so this says "save", not "download".
  select_download_folder: Save
  # Rows of the menu a right-click opens over the listing. The ellipsis marks
  # the ones that ask something before they act; the rows that take effect on
  # the spot — the refresh, the two clipboard rows, opening a directory and
  # selecting everything — carry none.
  #
  # `menu_open` is offered over a single directory only, and says what a
  # double-click on the row already does.
  menu_open: Open
  # The file counterpart of `menu_open`, in the same slot: over a directory the
  # obvious thing to do is go into it, over a file it is to look inside it. No
  # ellipsis — the pane opens on the spot, and nothing is asked first.
  menu_edit: Edit
  menu_download: Download…
  menu_rename: Rename…
  menu_delete: Delete…
  menu_new_folder: New folder…
  menu_upload: Upload files…
  menu_upload_folder: Upload folder…
  # The two rows that only hand text over: the entry's own name, and the whole
  # path an operation on it would have used. Neither has a `local:` twin — a
  # name and a path read the same whichever filesystem they came from.
  menu_copy_name: Copy name
  menu_copy_path: Copy path
  # Selects every entry of the listed directory. Left out once they all are.
  menu_select_all: Select all
  menu_refresh: Refresh
  # Hover labels for the panel's toolbar buttons, which carry an icon and no
  # text. Deliberately a separate set from the `menu_` rows above rather than a
  # reuse of them: a tooltip names a button and takes no ellipsis, while a menu
  # row promises the dialog that follows and does. They are also the only thing
  # a *disabled* button says, since the tooltip outlives the click handler, so
  # each one has to read as the name of the command rather than as an
  # instruction to press anything.
  tip_refresh: Refresh
  tip_new_folder: New folder
  tip_upload: Upload files
  tip_upload_folder: Upload folder
  tip_download: Download
  tip_rename: Rename
  tip_delete: Delete
  # The line under the listing while bytes are moving, one file at a time.
  # `%{percent}` counts the whole batch, not this one file, so it keeps rising
  # across a folder instead of restarting at every name.
  uploading: "Uploading %{name}… %{percent}%"
  downloading: "Downloading %{name}… %{percent}%"
  # The same line for a delete, where `%{percent}` counts entries rather than
  # bytes — nothing is moving — and a folder contributes every entry inside it,
  # so the bar keeps going through a tree instead of jumping once per name.
  deleting: "Deleting %{name}… %{percent}%"
  # Refusal when a second transfer is asked for while one is still running. One
  # progress bar per session can only describe one transfer honestly.
  transfer_busy: A transfer is already running here.
  uploaded: "Uploaded %{name}."
  # Two keys rather than a plural rule: only "exactly one" and "more than one"
  # are ever needed, as with the session overrides.
  uploaded_many: "Uploaded %{count} files."
  # Summary of a recursive upload, which is about folders as much as files.
  uploaded_tree: "Uploaded %{files} files in %{folders} folders."
  # Every chosen path turned out to be unreadable — a broken link, or something
  # removed between the drop and the walk. Not a success, so not phrased as one.
  nothing_to_upload: Nothing could be read to upload.
  downloaded: "Saved to %{path}."
  downloaded_tree: "Saved %{count} files to %{path}."
  # The question asked before anything is deleted. Two keys rather than a plural
  # rule, as with the upload summaries: naming the single entry is worth more
  # than counting it, and past one only the count fits.
  delete_confirm_one: "Delete %{name}?"
  delete_confirm: "Delete %{count} items?"
  # The button that answers it. Shorter than the menu row that promised the
  # question; this one *is* the answer, so it names the act and nothing else.
  delete: Delete
  deleted: "Deleted %{name}."
  deleted_many: "Deleted %{count} items."
  # Label over the rename field, which opens prefilled with the current name.
  rename_prompt: "Rename %{name} to:"
  rename: Rename
  renamed: "Renamed to %{name}."
  # Label over the new-folder field. It carries no `%{path}`: the field opens
  # under the breadcrumb that already says where "here" is, and a second copy of
  # a long remote path would only push the field itself off the strip.
  new_folder_prompt: "Name of the new folder:"
  # Shown inside the empty field. Unlike the rename field there is nothing to
  # prefill, so this is what tells the user what is being asked for.
  new_folder_placeholder: Folder name
  create: Create
  created: "Created %{name}."
  # A name that cannot be sent: empty, or one carrying a path separator or
  # `..`, which would rename the entry — or create the folder — in a different
  # directory entirely. Shared by both fields, since it is the same refusal.
  invalid_name: That name cannot be used.
  # The two refusals `menu_edit` can answer with. Neither is a failure of the
  # file — it is a perfectly good file — so both say what the editor cannot do
  # rather than what is wrong with it. `%{limit}` is a whole number of
  # megabytes; the unit is spelled here because it is not a value.
  edit_too_large: "Only files under %{limit} MB can be edited."
  edit_not_text: That file is not UTF-8 text, so it cannot be edited here.
  failed: "Remote files: %{error}"
  # Twins of the keys above, for a session whose filesystem is this computer's
  # own. Only the keys whose English says remote, server, upload or download
  # have one; everything else — `loading`, `empty`, the delete question, the
  # naming fields, `transfer_busy` — describes the same act on either side and
  # is shared, so a translation writes it once.
  #
  # The vocabulary is copying, not transferring: putting a file into a
  # directory on the disk it is already on is not an upload, and calling it one
  # would have the panel misdescribe the machine the user is sitting at.
  #
  # Three download-side keys are deliberately *not* twinned. `select_download_
  # folder` ("Save"), `downloaded` and `downloaded_tree` ("Saved to %{path}.")
  # say what happened without saying where the bytes came from, and are already
  # true of a copy out of either kind of filesystem.
  local:
    title: Local files
    # The shell, not a connection: there is no host to reach, so nothing here
    # can be waiting to connect.
    not_connected: The files appear once the shell has started.
    # Confirmation buttons of the two platform pickers, as above.
    select_copy_in: Copy files here
    select_copy_in_folder: Copy folder here
    # Rows of the menu a right-click opens, ellipsis included: each of them
    # still asks something before it acts.
    menu_copy_out: Copy to…
    menu_copy_in: Copy files here…
    menu_copy_in_folder: Copy folder here…
    # Hover labels of the toolbar buttons: the name of the command, and no
    # ellipsis, exactly as with the `tip_` keys above.
    tip_copy_in: Copy files here
    tip_copy_in_folder: Copy folder here
    tip_copy_out: Copy to another folder
    # One line for both directions. Copying a file into the listed directory
    # and copying one out of it are the same act when both ends are this
    # computer, and nothing in the sentence would tell them apart.
    copying: "Copying %{name}… %{percent}%"
    copied: "Copied %{name}."
    copied_many: "Copied %{count} files."
    copied_tree: "Copied %{files} files in %{folders} folders."
    nothing_to_copy: Nothing could be read to copy.
    failed: "Local files: %{error}"

# The placeholder shown while no session is open.
empty:
  # `%{shortcut}` is "Cmd+T" or "Ctrl+Shift+T"; neither is translated.
  hint: Press %{shortcut} to connect to a host.
  saved_profiles: Saved profiles
  # Heading of the dashboard column of the welcome screen, beside the saved
  # connections above it. The word names the section rather than any one
  # dashboard, so it stays plural however many there turn out to be.
  dashboards: Dashboards
  # The menu a right-click on a saved profile row opens. Only one of its four
  # rows is worded here: connecting, copying and forgetting a profile are the
  # same commands the connection dialog offers, so they reuse `connection.
  # connect`, `connection.duplicate` and `connection.delete` rather than saying
  # the same thing twice. Editing is the one that differs — from here the form
  # is not on screen yet, so the row promises it with an ellipsis where the
  # dialog's own button, which only fills a form already in front of the user,
  # takes none.
  menu_edit: Edit…
  # One row per file the connection follows, under `connection.connect`: the
  # same menu opens a shell or one of the logs. `%{name}` is the last component
  # of the path — the whole of it is in the pane the row opens, and would not
  # fit on a menu row — and is a file name, so it is never translated. The same
  # row is offered on the tab of a live session to that connection.
  menu_tail: "Tail %{name}"

# The bar along the bottom of the window.
statusbar:
  no_session: no session
  idle: idle

settings:
  title: Settings
  save_failed: "Could not save the settings: %{error}"
  # The question `Escape` asks over a settings form with unsaved changes; the
  # title and the two buttons are the connection dialog's own.
  discard_confirm: "The changes in the settings have not been saved. Close the dialog and lose them?"
  load_failed: "Settings cannot be saved, because the settings file could not be read when rulogman started: %{error}. Fix or move that file and restart rulogman."
  # Both the first row of the language list and the font list's "leave it to
  # the OS" row, so it has to read well for either.
  system_default: Use the system setting
  section:
    appearance: Appearance
    terminal: Terminal
    connection: New connections
  ui_theme: Interface theme
  # Who draws the window's title bar: rulogman's own, merged into the toolbar,
  # or the caption the operating system draws. Worded as in the sibling
  # database tools. Applied to the open window as soon as the settings are
  # saved.
  titlebar: Title bar
  titlebar_custom: Drawn by rulogman
  titlebar_system: Drawn by the system
  language: Interface language
  opacity: Opacity
  opacity_hint: "% (50–100)"
  blur: Blur the desktop behind the window
  scheme: Color scheme
  font: Font
  font_size: Font size
  font_size_hint: pt (6–32)
  scrollback: Scrollback
  scrollback_hint: lines (max 100000)
  # The name of the environment variable; stays "TERM" in every language.
  term: TERM
  copy_on_select: Copy the selection on mouse release
  local_file_panel: Show the file panel for shells on this machine
  # The editor a file opens in, not the terminal: on, a line too long for the
  # pane is broken at its width instead of running off to the right.
  editor_word_wrap: Wrap long lines in the editor
  port: Port
  username: Username
  username_placeholder: none
  keepalive: Keepalive
  keepalive_hint: seconds (0 disables)
  timeout: Connect timeout
  timeout_hint: seconds
  # The dashboards the user keeps. A dashboard is a named set of remote files
  # from any number of connections, opened side by side in one tab; it is
  # edited here rather than in a dialog of its own because it is the same kind
  # of thing to keep as a setting — a list edited nowhere near a live session
  # and applied by pressing Save.
  #
  # `%{count}` is a plain number. The counts are two keys rather than one
  # plural rule, the house rule everywhere a count is drawn on a header.
  dashboards:
    title: Dashboards
    hint: "A dashboard follows several remote files at once, each over the connection that reaches it, and opens them side by side in a single tab. Every connection it uses needs its credentials saved; opening it asks for any that are not."
    none: no files
    one: 1 file
    many: "%{count} files"
    add: Add dashboard
    # The action beside a dashboard's own fields. It removes the arrangement,
    # never the files it named: nothing on any remote host is touched.
    remove: Remove dashboard
    name: Name
    # The checkbox under a dashboard's name. Any number of dashboards may
    # carry it, and each one that does opens its own tab when rulogman
    # starts, so it reads as a mark on this arrangement rather than as a
    # single choice made among them all.
    open_at_startup: Open at startup
    # Headings of the two columns of a dashboard's table. The first doubles as
    # the word the connection picker shows while nothing has been picked.
    profile: Connection
    path: File
    # Heading of the column that picks the color a pane's header is painted in.
    color: Header color
    # Folds away the color picker a pane row's *Custom…* unfolded, keeping its color.
    color_done: "Done"
    add_pane: Add file
    # The action at the end of a file's row, worded like the counterparts in
    # the connection dialog's own repeatable sections.
    remove_pane: Remove
    # What the connection picker shows for a file whose connection has since
    # been deleted. The row keeps the deleted id rather than being rebound, so
    # the user repoints it themselves instead of finding it quietly pointing
    # somewhere else.
    missing_profile: (deleted connection)
    # A file with no connection chosen for it at all. A pane whose connection
    # was merely *deleted* still saves — its id is kept and the picker shows it
    # dead, see `missing_profile` — but one that never named a connection has
    # nothing to keep, and saving it would invent an answer the user never gave.
    incomplete: Give every file of a dashboard a connection, or remove the file.
    # Why Save is refused: the section above was drawn from nothing, so saving
    # it would empty the file. `%{error}` stays in English.
    load_failed: "Settings cannot be saved, because dashboards.json could not be read: %{error}. Fix or move that file and open Settings again."
  # The row of buttons under each of the two color pickers. The same five
  # words serve both, since a UI theme and a terminal scheme are managed the
  # same way; only the delete question has to say which of the two it means.
  # `%{error}` is the underlying failure and stays in English, as elsewhere.
  # The highlight rules a followed file's lines are colored by. The same rule
  # list is edited in two places — globally here, and per file on a row of the
  # connection dialog's "Tail files" section — so every word of it is worded
  # once, here, and the connection dialog looks these keys up too.
  highlights:
    title: Highlighting
    # `%{colors}` is a handful of the slot names the rules accept, taken from
    # the published list itself so the hint cannot drift from what parses.
    hint: "A rule colors every line of a followed file its pattern matches, and the first rule that matches a line wins. A color is a hex value like #7f1d1d, or the name of a slot in the terminal color scheme — %{colors} — which follows whatever scheme the session is running."
    pattern: Pattern
    # The two segments of a rule's scope picker: color only the span the
    # pattern matched, or the whole line it was found on.
    scope_match: Match
    scope_line: Line
    # Headings of the two color fields. "Text" rather than "Foreground": the
    # word beside it is "Background", and the pair has to read as a pair.
    foreground: Text
    background: Background
    bold: Bold
    ignore_case: Ignore case
    # The switch that keeps a rule without applying it. Deliberately short: it
    # sits at the end of a row of three ticks and is the least of the three.
    enabled: "On"
    add: Add rule
    # The action at the end of a rule's first line, worded like the
    # counterparts in every other repeatable section.
    remove: Remove
    # Puts the built-in rule list back. Saving an untouched preset stores
    # nothing, so a later build's improved preset still reaches the user.
    reset: Reset to preset
    # Refusals from the Save button, each quoting what the user typed. A
    # pattern that does not compile would be stored happily and would then
    # simply never match, and an unknown color would draw in the default one —
    # both look like a rule that is wrong about the log rather than about
    # itself, so both are caught while the text is still on screen.
    bad_pattern: "Not a valid regular expression: %{pattern}"
    bad_color: "Not a color rulogman knows: %{color}"
  manage:
    duplicate: Duplicate
    edit: Edit
    delete: Delete
    # Both open a platform file dialog, hence the ellipsis.
    import: Import…
    export: Export…
    # Confirmation button of that file dialog.
    import_select: Import
    # Why one chosen file was refused. Only the first refusal of a batch is
    # shown; `import_skipped` counts the rest.
    import_unreadable: "“%{file}” could not be read: %{error}"
    import_bad_color: "“%{file}” has no usable color for %{slot}."
    # The mistake most easily made: a palette file offered to the other
    # picker. Each names the row the file does belong under.
    import_not_a_theme: "“%{file}” is a color scheme. Import it under Color scheme."
    import_not_a_scheme: "“%{file}” is an interface theme. Import it under Interface theme."
    # Some of them were, some were not. Only the ones that failed are counted;
    # the ones that worked are already visible in the picker.
    import_skipped: "%{count} files were skipped."
    # The question asked before a file is removed. Two keys rather than one
    # with a noun in it: naming the kind is what makes the question readable,
    # and no language builds that sentence the same way.
    delete_theme_confirm: "Delete the theme “%{name}”?"
    delete_scheme_confirm: "Delete the color scheme “%{name}”?"
    # The name given to the copy that "Duplicate" makes.
    copy_name: "%{name} (copy)"
    write_failed: "Could not write the file: %{error}"
    delete_failed: "Could not remove the file: %{error}"
  # The editor that opens over the settings form for one theme or one scheme.
  editor:
    theme_title: Edit interface theme
    scheme_title: Edit color scheme
    name: Name
    dark: This is a dark palette
    # Shown when a field holds something that is not a color. Every field is
    # outlined in the danger color at the same time, so this only has to say
    # what a color looks like.
    invalid: "Every color has to be written as #RRGGBB."
    # An optional slot left empty, and the label such a field wears.
    automatic: Automatic
    automatic_slot: "%{name} (automatic)"
    # The heading over the slots a theme file may leave out.
    grid_group: Result grid — left out of the file unless a color is given
    # The eleven slots of a UI theme, in the order the editor lists them.
    slot:
      background: Window
      surface: Panels
      surface_hover: Hovered
      surface_active: Pressed
      border: Separators
      text: Text
      text_muted: Muted text
      accent: Accent
      danger: Errors
      success: Success
      # The dimming drawn behind a dialog: the only slot that may carry an
      # alpha channel.
      overlay: Dialog backdrop
      # The five the result grid of the sibling database tools is drawn from.
      # A theme file is shared with those tools, so the editor offers them even
      # though rulogman has no grid to draw; left empty they are derived, and
      # the file leaves them out.
      grid_header: Grid header
      grid_row_alt: Alternate row
      grid_selection: Grid selection
      grid_null: NULL marker
      grid_pk: Primary key
    # The four roles of a terminal palette, and the sixteen ANSI colors.
    term:
      foreground: Foreground
      background: Background
      cursor: Cursor
      selection: Selection
      # The heading the editor draws over the sixteen ANSI slots, which
      # follow the four roles above.
      ansi: ANSI colors
      black: Black
      red: Red
      green: Green
      yellow: Yellow
      blue: Blue
      magenta: Magenta
      cyan: Cyan
      white: White
      # The bright half of the palette. Spelled out rather than built from
      # the eight names above, because the editor looks a slot's label up by
      # key and never interpolates one.
      bright_black: "Bright Black"
      bright_red: "Bright Red"
      bright_green: "Bright Green"
      bright_yellow: "Bright Yellow"
      bright_blue: "Bright Blue"
      bright_magenta: "Bright Magenta"
      bright_cyan: "Bright Cyan"
      bright_white: "Bright White"

# The connection dialog: the saved-profile column, the form, and the messages
# the dialog reports back in.
#
# Sample values are *not* here: the host, name and key-path placeholders spell
# out an example rather than a word, and read the same in every language.
connection:
  title_new: New connection
  title_edit: "Edit connection"
  # `title_edit` while a saved profile is loaded to be edited; `title_connect`
  # while the dialog was opened on its way to a session, for a profile whose
  # secret is not saved.
  title_connect: "Connect"
  connect: Connect
  browse: Browse…
  # `edit`, `delete` and `duplicate` label the buttons a hovered profile row
  # reveals and the rows of the menu a right-click on one opens — the same
  # commands either way, so the same words. None takes an ellipsis: the form
  # they act on is already on screen. Delete asks first, in a question of its
  # own — see `delete_confirm` below.
  edit: Edit
  delete: Delete
  duplicate: Duplicate
  # The question every delete of a saved profile asks first — the row button,
  # the row menu and the welcome screen's menu alike. The wording is the one
  # rudbman and rudbgen use. `%{names}` is a comma-separated list of the
  # dashboards that follow a file over the connection, quoted by nothing.
  delete_title: "Delete connection"
  delete_confirm: "Delete the connection “%{name}” and its saved password?"
  delete_confirm_dashboards: "The dashboards %{names} follow files on it and will skip them from now on."
  # Confirmation button of the platform file picker for the private key.
  select_file: Select
  saved_profiles: Saved profiles
  empty_list: No saved profiles yet. Fill in the form and connect — the connection is saved automatically.
  # The rows pinned above the saved profiles, and the panel that replaces the
  # form once one of them is selected. `%{shell}` is the shell's own name — a
  # value, like the host and port samples above, and never translated. Neither
  # is `WSL`, which the Windows rows carry in place of `name` and which is a
  # product name rather than a word.
  #
  # `name` doubles as the dialog's own title while a local row is selected,
  # since neither "New connection" nor "Connect" describes opening a local
  # shell. `title` deliberately says something other than `name`, so the panel
  # reads as an explanation of the row rather than as a repeat of it.
  #
  # The two hints differ in one clause, and only because the platforms do. Unix
  # pins a single row, the login shell the user was given, so the sentence can
  # say which shell that is and why. Windows pins one row per shell it can
  # start — PowerShell, cmd, one per WSL distribution — and the user has just
  # chosen among them, so `hint_shell` names the choice and stops there. Each
  # is used on its own platform only.
  local:
    name: Local terminal
    title: Shell on this computer
    hint: "Opens %{shell}, your login shell, in a new tab. It runs on this computer, so there is no host to reach and no password to enter."
    hint_shell: "Opens %{shell} in a new tab. It runs on this computer, so there is no host to reach and no password to enter."
  name: Name
  folder: Folder
  no_folder: No folder
  host: Host
  port: Port
  username: Username
  authentication: Authentication
  password: Password
  key_file: Key file
  passphrase: Passphrase
  # Labels of the authentication picker. Their ids are not translated.
  auth:
    password: Password
    key: Private key
    agent: Agent
  password_placeholder: password
  passphrase_placeholder: optional
  # Placeholder of every per-session override field; a blank field inherits.
  inherit_placeholder: inherit
  remember_password: Remember password in the system keychain
  remember_passphrase: Remember passphrase in the system keychain
  show_files: Show the file panel when this connection opens
  agent_hint: Uses keys loaded in your system's SSH agent. No password or key file is needed.
  saved_secret: A secret saved in the system keychain will be used unless you type a new one.
  # Shown above the form when a dashboard opened it: the dashboard cannot
  # open until every connection it uses has credentials. `%{current}` and
  # `%{total}` count the connections asked for so far and in all.
  dashboard_note: "The dashboard “%{name}” needs this connection's credentials before it can open (%{current} of %{total}). Connect to continue; saving them in the keychain means they are not asked for next time."
  need_host: Enter the host to connect to.
  need_username: Enter the user to log in as.
  need_key: Choose the private key file to authenticate with.
  need_port: Enter a port between 1 and 65535.
  # Deleting a profile. Every outcome is a whole sentence of its own rather than
  # clauses the code joins, because neither the order nor the conjunction of
  # such a join survives translation. `%{error}` is the underlying failure and
  # stays in English.
  delete_failed_list: "The profile was deleted, but the profile list could not be written (%{error})."
  delete_failed_secret: "The profile was deleted, but its keychain entry could not be removed (%{error})."
  delete_failed_both: "The profile was deleted, but the profile list could not be written (%{list_error}) and its keychain entry could not be removed (%{secret_error})."
  # Duplicating, which can only fail the one way: the copy is in the list on
  # screen but the list itself did not reach the disk, so it is gone at the
  # next start. Worded like the delete above, from the same two halves.
  duplicate_failed: "The profile was copied, but the profile list could not be written (%{error})."
  # What the Save button reports, and the question `Escape` asks over a form
  # holding edits nobody saved. `summary_unfinished` wraps a section's
  # summary while one of its rows is half-written.
  saved: "Saved “%{name}”."
  save_problems: "Not everything could be saved:"
  discard_title: "Unsaved changes"
  discard_confirm: "The changes to this connection have not been saved. Close the dialog and lose them?"
  discard: "Discard changes"
  keep_editing: "Keep editing"
  summary_unfinished: "%{summary} · unfinished"
  # The profile list could not be read, so the list on screen may be empty
  # or stale and nothing is written over the file. Shown on opening and when a
  # copy or delete is refused.
  load_failed: "The saved profiles could not be read, so nothing can be saved, copied or deleted until profiles.json is fixed or moved: %{error}"
  # Connecting while something could not be stored: the heading, then one whole
  # sentence per problem, each on a line of its own.
  connect_problems: "Connecting, but not everything could be saved:"
  problem_secret_read: "The saved secret could not be read (%{error})."
  problem_profile_save: "The profile could not be saved (%{error})."
  problem_profile_unreadable: "The profile was not saved, because the saved profiles could not be read (%{error})."
  problem_no_secret: There was no secret to put in the keychain.
  problem_secret_save: "The secret could not be saved (%{error})."
  problem_secret_delete: "A previously saved secret could not be removed (%{error})."
  # The collapsible per-session section. The counts are two keys rather than one
  # plural rule, since only "one" and "more than one" are ever needed.
  overrides:
    title: Session overrides
    none: inherits every global setting
    one: 1 setting overridden
    many: "%{count} settings overridden"
    scheme: Color scheme
    # The card that keeps the global scheme instead of choosing one.
    scheme_default: Default
    font_size: Font size
    scrollback: Scrollback
    term: TERM
    charset: Character set
    # The first row of the character set dropdown, and its placeholder. Means
    # "inherit", and what is inherited is UTF-8: unlike the settings above it
    # there is no global character set behind this one. The other rows are the
    # canonical WHATWG names of the encodings — "EUC-KR", "Shift_JIS" — which
    # are also what gets stored, and are never translated.
    charset_default: Default
    inherits_value: "inherits %{value}"
    inherits_lines: "inherits %{value} lines"
  # The collapsible jump-host section, the equivalent of OpenSSH's `-J`. The
  # counts are two keys rather than one plural rule, as everywhere else in this
  # namespace, and count the hosts the user has started rather than the ones
  # that are ready — an unfinished hop is the one worth mentioning over a
  # closed section.
  #
  # The column headings sit over the first line of a hop; the second line is
  # its authentication, which the controls there label themselves. The sample
  # values hinting the fields are never translated.
  hops:
    title: Jump hosts
    none: connects directly
    one: 1 jump host
    many: "%{count} jump hosts"
    hint: The session logs in to each jump host in turn, and the last one opens the connection to the target host. A secret typed here is remembered in the system keychain.
    host: Host
    port: Port
    username: User
    add: Add jump host
    # The action at the end of a hop's first line. Names what it does to the
    # hop, not to the connection.
    remove: Remove
    # A hop missing its host, its user or — in private key mode — its key file,
    # or one whose port is outside 1-65535. Such a hop cannot be logged in to,
    # and a hop that fails does not fail alone: it fails the whole connection.
    incomplete: Complete or remove the unfinished jump host.
    # Keychain trouble, reported while the session opens anyway. `%{host}` is
    # the jump host as the user typed it; `%{error}` comes from the storage
    # layer and stays in English.
    secret_save_failed: "The secret for %{host} could not be saved (%{error})."
    secret_delete_failed: "The stored secret of the removed jump host %{host} could not be deleted (%{error})."
  # The collapsible port-forwarding section, the equivalent of OpenSSH's `-L`.
  # The counts are two keys rather than one plural rule, exactly as above, and
  # count the rules the user has started rather than the ones that are ready:
  # an unfinished rule is the one worth mentioning over a closed section.
  #
  # The column headings sit over the three fields of a rule; the fields
  # themselves are hinted with sample values, which are never translated.
  tunnels:
    title: SSH tunnels
    none: no ports forwarded
    one: 1 port forwarded
    many: "%{count} ports forwarded"
    hint: Each rule listens on a port of this computer and forwards it, through this session, to a host the remote machine can reach.
    local_port: Local port
    remote_host: Remote host
    remote_port: Remote port
    add: Add tunnel
    # The action at the end of a rule's row. Names what it does to the rule,
    # not to the connection: nothing is disconnected by it.
    remove: Remove
    # A rule with some of its three fields filled in, or with a port outside
    # 1–65535. Such a rule cannot be forwarded, and connecting without it would
    # open a session the user believes forwards a port it does not.
    incomplete: Complete or remove the unfinished tunnel rule.
  # The collapsible followed-file section. One path per row, so — unlike a
  # tunnel or a hop — a row here cannot be half-written and there is nothing to
  # refuse. The counts are two keys rather than one plural rule, as above.
  tails:
    title: Tail files
    none: no files followed
    one: 1 file followed
    many: "%{count} files followed"
    hint: Each file is followed, the way `tail -f` does, once the session is up. Give the absolute path on the remote host.
    add: Add file
    # The action at the end of a file's row. Stops following it; nothing on the
    # remote host is touched.
    remove: Remove
    # The tick that gives one file its own rules instead of the global ones.
    # Ticking it starts from a copy of the rules that apply now, so the edit
    # begins from what the file was already showing rather than from nothing.
    custom_highlights: Custom highlighting
    # Refused before the session opens, for the reason `settings.highlights.
    # bad_pattern` refuses a save: a rule that cannot be compiled would follow
    # the file silently doing nothing.
    incomplete: "A followed file has a highlighting rule rulogman cannot use: check its pattern and its colors."

# Session life cycle, shown in the status bar and in the terminal overlay.
#
# `%{reason}`, `%{kind}` and `%{message}` are produced by the SSH layer and are
# English wherever they appear; only the sentence around them is translated.
session:
  connecting: connecting
  connected: connected
  disconnected: "disconnected: %{reason}"
  failed: "%{kind}: %{message}"
  reconnect: Reconnect
  # The overlay button of a local session. A shell that ended is started again,
  # not reconnected to — there was never a connection.
  restart: Restart
  # The failure card's button that opens the connection form on the session's
  # profile, after a refused login or an unusable key; the answer reconnects
  # the same pane. `stage` is the line under *connecting*; `kind` names a
  # failure (in place of the transport's English word) and `hint` says what
  # to check about it.
  edit_connection: "Edit connection…"
  stage:
    opening: "Opening the connection and checking the host key…"
    logging_in: "Host verified; logging in and starting the shell…"
  kind:
    connect: "connection failed"
    host_key: "host key rejected"
    auth: "authentication failed"
    key_load: "authentication keys unavailable"
    channel: "channel request failed"
    io: "i/o error"
  hint:
    connect: "Check the host name and the port, and that the server can be reached from this computer."
    host_key: "The key the server presented was refused. Check the host, and the known_hosts entry recorded for it."
    auth: "The server refused the user name or the credentials. Edit the connection to correct them; the new ones are used for this pane."
    key_load: "The private key could not be read or decrypted, or the SSH agent offered no usable key. Check the key file and its passphrase, or the keys loaded into the agent."
    channel: "The login worked, but the server would not open a terminal. It may limit sessions, or forbid a terminal for this account."
    io: "The connection broke while it was in use. Reconnect to try again."
  # Why a session could not even be attempted, because of one of the jump hosts
  # it would have gone through. Both are refusals made here rather than out on
  # the network, which is why — unlike `failed` above — they are translated
  # rather than quoted from the SSH layer. `%{hop}` is the jump host written
  # `user@host:port`, and is never translated.
  #
  # The secret one names the only place the user can put it right: the jump
  # hosts live in the connection's own settings and have no dialog of their own.
  hop_secret_missing: "No secret is stored for the jump host %{hop}. Enter it again in this connection's settings."
  host_key:
    # The headline of the card a connection refused over a changed host key
    # shows. `%{host}` is the record's `host:port` — a jump host's when it was
    # a hop that changed — and is never translated.
    changed: "The host key of %{host} has changed"
    # Under the headline. Names the risk first, because it is the reason the
    # connection was refused, and the benign explanations second.
    warning: "rulogman refused to connect. Someone may be intercepting this connection (a machine-in-the-middle attack), or the server may have been reinstalled or given new keys."
    # The two keys, printed in full so they can be compared with what the
    # server's administrator reads off its console. `%{algorithm}` is the SSH
    # name (`ssh-ed25519`) and `%{fingerprint}` the `SHA256:...` form; neither
    # is translated.
    recorded: "Recorded: %{algorithm} %{fingerprint}"
    presented: "Presented now: %{algorithm} %{fingerprint}"
    # The first of the two clicks past a changed key. It only asks; nothing
    # is removed until `confirm_button` under `confirm`.
    replace: "Remove the old key and reconnect…"
    # The question the first click raises. Says what checking means and what
    # the removal does: trust on first use records the next key, whatever it is.
    confirm: "Only continue if you know why the key changed and have checked the new fingerprint with the server's administrator or on its console. The old key for %{host} is removed, and whatever key the server presents on the next connection is trusted from then on."
    confirm_button: "Remove key and reconnect"
    # The confirming button while the record is being removed.
    removing: "Removing the old key…"
    # `%{error}` is the storage layer's, in English.
    forget_failed: "The old key could not be removed: %{error}"
  overlay:
    connecting: "Connecting to %{host}…"
    disconnected: "Disconnected from %{host}"
    failed: "Could not connect to %{host}"
    # The same three states for a local session, worded for a shell rather than
    # for a host: `%{shell}` is its name, and nothing here is a connection.
    # `local_failed` is only ever reached when the shell could not be started at
    # all; a shell that ran and then ended is `local_exited`.
    local_starting: "Starting %{shell}…"
    local_exited: "%{shell} exited"
    local_failed: "%{shell} could not be started"

# The menu a right-click on the terminal grid opens. Its pane commands — the
# two splits and the break-out — are not here: they are the same commands the
# application menu and the tab context menu carry, so they reuse the `menu:`
# keys rather than saying the same thing a third time. So does the row that
# reconnects, which reuses `session.reconnect` / `session.restart`, the wording
# the connection overlay's own button already uses.
terminal:
  menu_copy: Copy
  menu_paste: Paste
  # Selects the rows the viewport is showing, which is exactly as much as a copy
  # afterwards can reach — not the whole scrollback.
  menu_select_all: Select all
  # Drops the history that has scrolled off the screen. The screen itself, and
  # the shell on it, are untouched, so this is not a "clear" in the shell sense.
  menu_clear_scrollback: Clear scrollback
  # Brings the viewport back down to the live screen. Only offered while it is
  # somewhere else.
  menu_scroll_bottom: Scroll to bottom
  # Closes this pane alone. On an unsplit tab that is the same thing as closing
  # the tab, which is why the wording names the pane rather than promising one
  # or the other.
  menu_close_pane: Close pane

# The menu a right-click in a text field opens. Four rows the whole application
# shares, which is why they are worded here rather than by the dialogs that put
# the fields on screen.
input:
  menu_cut: Cut
  menu_copy: Copy
  menu_paste: Paste
  menu_select_all: Select all

# The multi-line editor: its find bar, and the pane a file opened from the file
# panel is shown in. In the find bar only the two fields carry words — the case
# toggle is marked `Aa` and the match counter is a pair of numbers, and neither
# is written differently in any language.
editor:
  # Placeholder of the field the search query is typed into. A noun, not the
  # imperative — it names what the field holds, the way `files.title` names the
  # panel.
  find: Find
  # Placeholder of the field beneath it, shown only while replacing.
  replace: Replace
  # The rows of the menu a right-click in the buffer opens. Imperatives, unlike
  # the two placeholders above, and separate keys from them for exactly that
  # reason: a language that spells a command differently from the box it fills
  # needs somewhere to say so. Each row is one of the editor's own commands and
  # is grayed out when the buffer cannot answer it — nothing is selected, the
  # history is empty, the file is read-only — so the wording never has to hedge.
  # A row that saves the file is at the foot of the menu under `common.save`.
  menu_cut: Cut
  menu_copy: Copy
  menu_paste: Paste
  menu_select_all: Select all
  menu_undo: Undo
  menu_redo: Redo
  # Comments the selected lines out, or uncomments them if they all already are.
  # Worded for no language in particular: the prefix is whatever the file's
  # language writes a line comment with — `#`, `//`, `--` — and the row is
  # grayed for a format that has none.
  menu_toggle_comment: Toggle comment
  # Both open the find bar — the second with its replace row already showing.
  menu_find: Find…
  menu_replace: Replace…
  # In the pane's header while a save is in flight. It sits next to the file
  # name, so it says what is happening and not what to.
  saving: Saving…
  # In the pane's header in place of the Save button, when the file was opened
  # on an account that may not write it. A state and not a command, which is
  # what the hyphen is doing: it describes the pane rather than offering to
  # make it so. Nothing is pressed here.
  read_only: Read-only
  # Its tooltip, and the only place the reason is given. A statement about the
  # account rather than about the file — the file may well be writable by
  # somebody — and worded like `charset_dirty` above: what the situation is,
  # with no apology and no advice.
  read_only_tip: You do not have permission to modify this file.
  # The button beside that badge, on a session that has a way through: a WSL
  # distribution, whose root costs no password, or an SSH session whose remote
  # account can `sudo`. An imperative, and a promise about the whole pane rather
  # than about one save — pressing it unlocks the buffer as well.
  edit_as_root: Edit as root
  # Its tooltip. Both halves of what the press does, in the order they happen,
  # because the second is the one worth knowing before pressing. It does not
  # mention the password: whether one is wanted depends on the host, and the
  # dialog that asks is a plain enough answer when it does.
  edit_as_root_tip: Unlock the file and save it as root.
  # Title of the dialog that asks for the `sudo` password of the remote account.
  # A statement of the situation rather than an instruction — the sentence
  # underneath is the instruction — and it names no file, because the prompt
  # does.
  sudo_title: Password required
  # That sentence. `%{name}` is the file's own name, as in `saved` below, and
  # `sudo` is a program's name and stays spelled that way in every language. It
  # says *whose* password is wanted, which is the question a user faced with an
  # unexpected password box actually has: the one for this account on the remote
  # host, not the one for root and not the one for this computer.
  sudo_prompt: "Saving %{name} as root needs the sudo password for this account."
  # The tick box under the field, unticked when the dialog opens. "This session"
  # is rulogman's own run and not the shell's: what it buys is that later saves
  # of this file ask nothing, and what it costs is a password held in memory
  # until the file is closed. It is never written to disk.
  sudo_remember: Remember for this session
  # The strip under the editor when the button was pressed and the source would
  # not have it — a `sudo` whose remembered permission had run out, a session
  # that had gone. Distinct from `save_failed` because nothing was being saved:
  # the buffer is untouched and still locked. `%{error}` is the sentence the
  # backend gave, which is not translated.
  root_failed: "Could not edit as root: %{error}"
  # In the header beside the Save button once that has been pressed, in the
  # danger color. The account, and nothing else: a marker rather than a
  # sentence, since it sits there for as long as the file is open and a sentence
  # would stop being read on the second glance. `root` is a user name and stays
  # spelled that way in every language.
  as_root: root
  # Its tooltip, which is where the sentence went. Present tense about the next
  # save rather than past tense about the button, because what matters is what
  # happens now — the same choice `read_only_tip` makes.
  as_root_tip: Saving writes this file as root.
  # The strip under the editor after a save. `%{name}` is the file's own name,
  # never a path: the header above already says which file the pane holds.
  saved: "Saved %{name}."
  # The same strip when the write failed. `%{error}` is the sentence the
  # filesystem or the server gave, which is not translated — it is also what a
  # save attempted after the session ended reports, since the source is what
  # refuses.
  save_failed: "Could not save: %{error}"
  save_conflict: "The file changed outside the editor. Reopen it before saving again."
  # The same strip when the file could not be replaced without handing it to
  # this account or changing its mode — usually a file another account owns
  # that this one may write. Says that nothing happened to the file, since a
  # failed save on a shared file is exactly when someone wonders.
  save_unpreservable: "Not saved: %{name} belongs to another account, or its permissions cannot be copied, and replacing it would change them."
  # The button at the end of that strip, on a file on this computer: the way
  # past it. A command, like `edit_as_root`, and like it the cost is in the
  # tooltip below rather than in the label.
  write_in_place: Write in place
  # Its tooltip: what the press keeps, then what it gives up.
  write_in_place_tip: "Overwrite the file where it stands, keeping its owner and permissions. There is no recovery copy, and a write cut short leaves the file incomplete."
  # Title of the question asked before a pane holding unsaved changes is closed.
  close_title: Unsaved changes
  # The question itself. Three answers: save, discard or cancel. A save that
  # fails leaves the pane open, with the failure under the file where it can be
  # read.
  close_unsaved: "%{name} has unsaved changes. Close it and lose them?"
  # The answer that closes the pane. Named for what it costs rather than for the
  # act, because the act — closing — is not the part worth confirming.
  close_discard: Discard changes
  close_cancel: Cancel
  # The status bar's file-type indicator, which is also a button: it names what
  # the open file is being colored as, and opens a list of every format the
  # editor knows. Only two strings, because every other row of that list is a
  # proper name — YAML, Dockerfile, the name a syntax definition gave itself —
  # and a proper name is the same in every language.
  # The row and the label for a file being colored as nothing in particular.
  # A description rather than a name, which is why this one is translated.
  language_plain: Plain text
  # Tooltip of the indicator. A noun: it names what the button shows, the way
  # `files.title` names the panel.
  language_tip: File type
  # The status bar's character-encoding indicator, which sits beside the file
  # type and works the same way: it names the encoding the open file was decoded
  # in, and opens the list of the ones the editor offers. Every row of that list
  # is an encoding's own name — UTF-8, EUC-KR, windows-1252 — and a name is the
  # same in every language, so only the four strings below are words.
  # Tooltip of the indicator. It says what picking a row does as well as what the
  # button shows, because unlike the file type this choice re-reads the file.
  charset_tip: Character encoding — reopens the file in the one you pick
  # The strip under the editor when the picker was used on a buffer with unsaved
  # changes. Refused rather than asked about: re-reading replaces the buffer
  # whole, and there is no way to carry the edits through it.
  charset_dirty: Save your changes before changing the encoding
  # The same strip when the file came back but its bytes are not text in the
  # encoding that was picked. Only UTF-8 can say this — every other encoding in
  # the list reads any byte at all — and `%{charset}` is its name, not a word.
  charset_not_text: "Not readable as %{charset}"
  # And when the file could not be fetched again at all. `%{error}` is the
  # sentence the filesystem or the server gave, which is not translated.
  charset_failed: "Could not reopen the file: %{error}"
  # Takes the place of `saved` when the file was written but the encoding had no
  # byte for some of what the buffer held. A save that worked and lost something
  # at the same time, which is why it is worded as both.
  saved_lossy: 'Saved, but characters %{charset} cannot express were replaced with "?".'

# The about box. The version, the license name and the names of the libraries
# are values, not words, and are never translated.
about:
  title: About rulogman
  version: "Version %{version}"
  tagline: A multi-platform GUI SSH terminal built on gpui.
  license: "Licensed under %{license}."
  credits: Built with gpui (vendored and patched), russh and alacritty_terminal.

# The update dialog, in all of its states: the announcement the start-up check
# puts up when GitHub has a newer release than the running build, the manual
# check from the menu, and the download that installs it. Both version numbers
# are values, not words, and the name `rulogman` is not translated either.
update:
  title: Update available
  available: "%{app} %{version} is available."
  # Second line, quieter than the first: which build the user is looking at
  # right now, so the offer means something without them going to the about box.
  installed: "You are currently running %{version}."
  # Downloads the release built for this platform and restarts into it. Falls
  # back to opening the release page where the project publishes no such build.
  update: Update
  # Never mention *this* release again. A later one still announces itself, so
  # the wording has to name the version rather than promise silence in general.
  ignore: Ignore this version
  # A check the user asked for, before the answer arrives. The start-up check
  # shows nothing at all until it has one.
  checking: Checking for updates…
  # The answer no other path ever shows: the start-up check stays silent here.
  up_to_date: You are up to date.
  # The two halves of an install, shown above the progress bar.
  downloading: Downloading…
  installing: Installing…
  # Heading of the error state. The detail printed underneath it comes from the
  # operating system, from `tar`, or from the server, and is not translated.
  failed: The update failed.
  # The way out of the error state, and of a release with no build for this
  # platform: the browser, and the user takes it from there.
  open_release: Open the release page
  # Heading over the release's own notes in an announcement, read from the
  # GitHub release body. The notes themselves are shown as published.
  notes: "What's new"
