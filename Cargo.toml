[workspace]
resolver = "3"
members = ["crates/*"]

# gpui comes from a pinned revision of Zed's monorepo rather than from
# crates.io. 0.2.2 is still the newest published version and it predates the
# split of the crate into a platform-independent core (`gpui`), a façade that
# picks a backend at compile time (`gpui_platform`) and the backends themselves
# (`gpui_linux`, `gpui_macos`, `gpui_windows`) — a split every API below is
# written against, so there is no release to fall back to. A revision, never a
# branch: the monorepo's main moves several times a day, and a floating
# dependency would make two checkouts of this repository build different
# applications.
#
# Zed has no answer of its own for the four things `ruui` carries, so the crates
# that need one are vendored *there* — `ruui/vendor/` — and patched back over the
# git source by the `[patch."https://github.com/zed-industries/zed"]` table
# below. rulogman no longer holds copies of its own: the widget kit and the
# patched framework it is written against are one repository, so a fix made once
# is a fix in every application that draws with it. What the patches are, and
# what each of them puts back, is documented beside `ruui`'s own patch table;
# the marker in the vendored sources is still `RULOGMAN PATCH`, since these
# trees were first grown here.
#
# `gpui_platform` is taken from git unpatched — it is a hundred lines of
# `cfg`-directed re-exports — but it still has to be named in the patch table's
# sibling crates, because it is what resolves `gpui_linux` and friends.
#
# The four entries below, and the `ruui` dependency itself further down, all
# name the same git URL and the same revision. A git dependency is identified
# by URL and revision together, so one revision named everywhere is what makes
# these a single checkout of `ruui` rather than five independent ones — and
# what keeps `gpui` linked exactly once into the binary. Moving to a newer
# `ruui` revision means bumping all six occurrences together.
#
# Working on `ruui` and rulogman side by side still works the same way it did
# before the remote existed: add an uncommitted `.cargo/config.toml` here with
# its own `[patch."https://github.com/xcomart/ruui"]` table pointing
# `ruui = { path = "../ruui/crates/ruui" }` (and the vendored crates, if those
# are what changed) at a sibling checkout — cargo lets a `path` patch layer
# over a `git` one.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/xcomart/ruui", rev = "66ac064ca54cc2e66d02d6b4be620e9d1c663360" }
gpui_linux = { git = "https://github.com/xcomart/ruui", rev = "66ac064ca54cc2e66d02d6b4be620e9d1c663360" }
gpui_macos = { git = "https://github.com/xcomart/ruui", rev = "66ac064ca54cc2e66d02d6b4be620e9d1c663360" }
gpui_windows = { git = "https://github.com/xcomart/ruui", rev = "66ac064ca54cc2e66d02d6b4be620e9d1c663360" }

# unicode-width 0.2 follows Unicode 16, which promoted a handful of symbol
# blocks from one column to two. The rest of the deployed world did not move
# with it: glibc's wcwidth and vim's own built-in width table both still answer
# one for them. A terminal emulator does not get to hold a private opinion
# here — it must agree with the applications drawing into it, because they lay
# their output out by their own count and the grid advances by ours. The
# visible symptom is vim-airline: its default powerline `maxlinenr` symbol is
# U+2630 '☰', vim budgets one column for it, the grid takes two, and the status
# line overflows onto the next row.
#
# The narrowed copy lives in `ruui` — `ruui/vendor/unicode-width`, alongside the
# patched framework rather than beside a fifth vendored tree here — and narrows
# exactly the ranges where the tables disagree with wcwidth in the widening
# direction, in `src/tables.rs`, marked `RULOGMAN PATCH`:
#   * U+2630..U+2637   — the eight trigrams, airline's '☰' among them
#   * U+268A..U+268F   — monogram and digram symbols
#   * U+1D300..U+1D356 — Tai Xuan Jing symbols
#   * U+1D360..U+1D376 — counting rod numerals
# Both `lookup_width` and `lookup_width_cjk` gain the same early return, since
# these were neutral rather than ambiguous before Unicode 16.
#
# The patch lives outside this workspace's own code because `alacritty_terminal`
# calls `UnicodeWidthChar::width` directly when it sizes a cell, with no hook to
# inject a width policy. Delete the patch, and `ruui`'s copy once nothing else
# wants it, as soon as either end of that moves: `alacritty_terminal` growing a
# way to supply the width function, or the distributions' wcwidth catching up to
# the Unicode 16 widths.
#
# Same URL and revision as the `gpui` patches and the `ruui` dependency above
# and below — see the comment on the first patch table for why that has to
# hold across all six.
[patch.crates-io]
unicode-width = { git = "https://github.com/xcomart/ruui", rev = "66ac064ca54cc2e66d02d6b4be620e9d1c663360" }

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
authors = ["rulogman contributors"]
repository = "https://github.com/xcomart/rulogman"

[workspace.dependencies]
# --- shared utilities ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = "4"
parking_lot = "0.12"
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

# --- character sets: what a legacy host's byte stream actually means ---
# A session is not always UTF-8. Korean and Japanese hosts that predate it — and
# the ones whose locale was never changed — speak EUC-KR or Shift_JIS, and bytes
# from such a host decoded as UTF-8 are a screenful of replacement characters.
# `encoding_rs` is free of charge here: it is already pinned three times over in
# the lockfile (`serde_norway`, gpui's `reqwest`, `xim-ctext`), so naming it adds
# a dependency edge and not a crate.
#
# Two properties make it the right one rather than merely the cheapest. It
# implements the WHATWG Encoding Standard, where the label `euc-kr` resolves to
# Windows-949/UHC — the superset Korean hosts and files actually use, not the
# narrow 1987 EUC-KR that a standards-literal decoder would apply and choke on.
# And its `Decoder` is a streaming state machine: a multi-byte character split
# across two reads of a socket is the normal case, not the exception, and the
# partial sequence has to survive between chunks.
encoding_rs = "0.8"

# --- text buffer: the editor's document ---
# A rope, because the editor is opened on whatever the file panel hands it —
# a multi-gigabyte log as readily as a ten-line config — and has to stay
# responsive: an insert is O(log n) rather than the memmove a `String` would do,
# and line lookups are O(log n) rather than a scan. Two of its indexes are load
# bearing beyond that — `byte_to_line`/`line_to_byte` are what let the renderer
# address the buffer by line without ever holding the whole of it, and
# `char_to_utf16_cu`/`utf16_cu_to_char` are what make the IME's UTF-16 offsets
# convertible in O(log n) instead of the whole-string walk a flat buffer needs
# on every composition step. Default features are off so that a line break is
# `\n` or `\r\n` and nothing else: with `unicode_lines` a `\u{2028}` inside a
# log line would split a row in the rope that no other reader of the file
# splits, and every view of the buffer has to agree on where the lines are.
ropey = { version = "1.6", default-features = false, features = [
    "cr_lines",
    "simd",
] }
# --- user-supplied syntax definitions: the editor's extra languages ---
# The editor ships six hand-written lexers; anything beyond them comes from a
# definition file the user drops into the `syntaxes` directory. YAML rather than
# the JSON every other configuration file here is written in, because these
# files are *only* ever hand-written: they want comments, and they are mostly
# quotes, backslashes and brackets — exactly the characters JSON makes a person
# double-escape. Nothing writes one, so this is a read-only dependency of
# `rulogman-app` and no serializer of it is ever linked.
#
# The obvious crate, `serde_yaml`, was archived in March 2024 and its last
# release says `+deprecated` in its own version number, so the choice is between
# the two maintained forks. They are the same size to the byte: both depend on
# `indexmap`, `itoa`, `ryu`, `serde` and a libyaml binding, and the first four
# are already in the lockfile, so either adds exactly two crates to the build.
# The tie-break is what that fifth dependency *is*. `serde_yaml_ng` still pulls
# dtolnay's `unsafe-libyaml` 0.2.11, which was archived alongside `serde_yaml`
# itself — the fork would inherit the very dead code it was made to escape —
# whereas `serde_norway` carries `unsafe-libyaml-norway`, a fork of that binding
# that is still receiving releases. The crate has no features at all, default or
# otherwise, so there is nothing here to turn off.
serde_norway = "0.9"
futures = "0.3"
async-trait = "0.1"
bitflags = "2"
tempfile = "3"
# Unix-only, and used only where a raw syscall is unavoidable: clearing
# `O_NONBLOCK` on a pty master, and reading the passwd entry.
libc = "0.2"

# --- local pty, Windows only ---
# `alacritty_terminal` does have a ConPTY backend, but it is built around
# alacritty's own IOCP poller and cannot be driven by a blocking reader thread
# the way its unix `tty` module can. wezterm's pty crate wraps ConPTY behind
# plain `Read`/`Write`, which is what `rulogman-pty`'s driver is shaped for. Its
# default feature set is empty — the optional `serde_support` would pull serde
# into a crate that never serialises anything — so nothing needs turning off.
portable-pty = "0.9"

# --- localization ---
# `rust-i18n` compiles `crates/rulogman-app/locales/*.yml` into the binary, so
# there is no runtime asset to ship; `sys-locale` is only consulted when the
# user has not pinned a language in `settings.json`.
rust-i18n = "4"
sys-locale = "0.3"

# --- async runtime (SSH transport only) ---
# `fs` is needed by the SFTP layer only: file transfers stream through
# `tokio::fs` so a multi-gigabyte copy never blocks the session worker.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
] }

# --- SSH.  NOTE: default features pull in `aws-lc-rs`, whose build requires
# NASM on Windows.  The `ring` backend builds everywhere with no extra tooling. ---
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }

# --- SFTP.  Rides on a russh channel with the `sftp` subsystem requested, so
# it inherits the transport (and the crypto backend) chosen above. ---
russh-sftp = "2.3"

# --- HTTPS.  One caller: the start-up update check, which asks the GitHub
# releases API for the latest tag.  A blocking client rather than a `tokio`-based
# one because the call is a single request made from the background executor and
# never from the UI thread, so there is nothing for an async client to interleave
# with; `tokio` is deliberately confined to the SSH transport.
#
# The feature set is spelled out even though it happens to equal the default,
# because *which* TLS backend is chosen is load-bearing: `rustls` here resolves
# to the `ring` provider, whereas `native-tls` would drag in `aws-lc-rs` and with
# it a NASM requirement on Windows — the same trap the russh entry above avoids.
# `gzip` is kept because the API answers with compressed JSON. ---
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# --- SHA-256, for the self-updater.  The GitHub releases API publishes a
# `digest` field for every asset, and an updater that overwrites its own binary
# should check it.  `ring` is already in the tree twice over — it is the crypto
# backend both `russh` and `ureq`'s `rustls` resolve to — so naming it directly
# adds a dependency edge and not a crate: the version below is the one the
# lockfile already pins for them. ---
ring = "0.17"

# --- terminal emulation (same engine Zed uses) ---
alacritty_terminal = "0.26"

# --- GUI: Zed's GPU-accelerated UI framework ---
# Two crates, one revision, and the revision has to be spelled out in both: a
# git dependency is identified by URL *and* revision, so naming the same commit
# twice is what makes them one source rather than two checkouts of the same
# repository. See the patch table at the top of this file for why a revision at
# all, and for what `ruui`'s vendored crates put back on top of it.
#
# `gpui` is the platform-independent core, and everything the application
# writes is against it. `gpui_platform` is the façade that links a backend in
# and starts it — `application()` where 0.2.2 had `Application::new()`. Its
# features are empty by default and the backend inherits them, so the two
# display servers Linux might be running under have to be asked for by name;
# `font-kit` is macOS's text stack and is inert elsewhere.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", features = [
    "font-kit",
    "wayland",
    "x11",
] }

# --- the widget kit ---
# Every view in `rulogman-app` is built out of it: the theme layer, the text
# input, the tab strip, the menus, the dialogs. It is a separate repository
# because it is shared with the sibling database tools, and nothing in it knows
# what a session or a terminal is. Same URL and revision as the `gpui` patches
# above; see the comment on the first patch table for why that has to hold.
ruui = { git = "https://github.com/xcomart/ruui", rev = "66ac064ca54cc2e66d02d6b4be620e9d1c663360" }

# --- internal crates ---
rulogman-core = { path = "crates/rulogman-core" }
rulogman-pty = { path = "crates/rulogman-pty" }
rulogman-ssh = { path = "crates/rulogman-ssh" }
rulogman-term = { path = "crates/rulogman-term" }

[profile.dev]
# gpui + its dependency tree is large; keep debug builds usable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
