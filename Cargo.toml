[workspace]
resolver = "3"
members = ["crates/*"]

# gpui comes from a pinned revision of Zed's monorepo rather than from
# crates.io. 0.2.2 is still the newest published version and it predates the
# split of the crate into a platform-independent core (`gpui`), a façade that
# picks a backend at compile time (`gpui_platform`) and the backends themselves
# (`gpui_linux`, `gpui_macos`, `gpui_windows`) — a split every API below is
# written against, so there is no release to fall back to. A revision, never a
# branch: the monorepo's main moves several times a day, and a floating
# dependency would make two checkouts of this repository build different
# applications.
#
# Zed has no answer of its own for the five things `rugpui` carries, so the crates
# that need one are vendored *there* — `rugpui/vendor/` — and patched back over the
# git source by the `[patch."https://github.com/zed-industries/zed"]` table
# below. rulogman no longer holds copies of its own: the widget kit and the
# patched framework it is written against are one repository, so a fix made once
# is a fix in every application that draws with it. What the patches are, and
# what each of them puts back, is documented beside `rugpui`'s own patch table;
# the marker in the vendored sources is still `RULOGMAN PATCH`, since these
# trees were first grown here.
#
# `gpui_platform` is taken from git unpatched — it is a hundred lines of
# `cfg`-directed re-exports — but it still has to be named in the patch table's
# sibling crates, because it is what resolves `gpui_linux` and friends.
#
# The four entries below and the four `rugpui` crates further down all name the
# same git URL and the same revision. A git dependency is identified by URL and
# revision together, so one revision named everywhere is what makes these a
# single checkout of `rugpui` rather than eight independent ones — and what keeps
# `gpui` linked exactly once into the binary. Moving to a newer `rugpui` revision
# means bumping all eight occurrences together.
#
# Working on `rugpui` and rulogman side by side still works the same way it did
# before the remote existed: add an uncommitted `.cargo/config.toml` here with
# its own `[patch."https://github.com/xcomart/rugpui"]` table pointing
#     rugpui = { path = "../rugpui/crates/rugpui" }
#     rugpui-editor = { path = "../rugpui/crates/rugpui-editor" }
#     rugpui-shell = { path = "../rugpui/crates/rugpui-shell" }
# at a sibling checkout — cargo lets a `path` patch layer over a `git` one, and
# the vendored crates below can be overridden the same way when those are what
# changed.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f" }
gpui_linux = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f" }
gpui_macos = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f" }
gpui_windows = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f" }

# unicode-width 0.2 follows Unicode 16, which promoted a handful of symbol
# blocks from one column to two. The rest of the deployed world did not move
# with it: glibc's wcwidth and vim's own built-in width table both still answer
# one for them. A terminal emulator does not get to hold a private opinion
# here — it must agree with the applications drawing into it, because they lay
# their output out by their own count and the grid advances by ours. The
# visible symptom is vim-airline: its default powerline `maxlinenr` symbol is
# U+2630 '☰', vim budgets one column for it, the grid takes two, and the status
# line overflows onto the next row.
#
# The narrowed copy lives in `rugpui` — `rugpui/vendor/unicode-width`, alongside the
# patched framework rather than beside a fifth vendored tree here — and narrows
# exactly the ranges where the tables disagree with wcwidth in the widening
# direction, in `src/tables.rs`, marked `RULOGMAN PATCH`:
#   * U+2630..U+2637   — the eight trigrams, airline's '☰' among them
#   * U+268A..U+268F   — monogram and digram symbols
#   * U+1D300..U+1D356 — Tai Xuan Jing symbols
#   * U+1D360..U+1D376 — counting rod numerals
# Both `lookup_width` and `lookup_width_cjk` gain the same early return, since
# these were neutral rather than ambiguous before Unicode 16.
#
# The patch lives outside this workspace's own code because `alacritty_terminal`
# calls `UnicodeWidthChar::width` directly when it sizes a cell, with no hook to
# inject a width policy. Delete the patch, and `rugpui`'s copy once nothing else
# wants it, as soon as either end of that moves: `alacritty_terminal` growing a
# way to supply the width function, or the distributions' wcwidth catching up to
# the Unicode 16 widths.
#
# Same URL and revision as the `gpui` patches above and the `rugpui` crates
# below — see the comment on the first patch table for why that has to hold
# across all eight.
[patch.crates-io]
unicode-width = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f" }

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "MIT"
authors = ["rulogman contributors"]
repository = "https://github.com/xcomart/rulogman"

[workspace.dependencies]
# --- shared utilities ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = "4"
parking_lot = "0.12"
smallvec = "1"
unicode-width = "0.2"

# --- character sets: what a legacy host's byte stream actually means ---
# A session is not always UTF-8. Korean and Japanese hosts that predate it — and
# the ones whose locale was never changed — speak EUC-KR or Shift_JIS, and bytes
# from such a host decoded as UTF-8 are a screenful of replacement characters.
# `encoding_rs` is free of charge here: it is already pinned three times over in
# the lockfile (`serde_norway`, gpui's `reqwest`, `xim-ctext`), so naming it adds
# a dependency edge and not a crate.
#
# Two properties make it the right one rather than merely the cheapest. It
# implements the WHATWG Encoding Standard, where the label `euc-kr` resolves to
# Windows-949/UHC — the superset Korean hosts and files actually use, not the
# narrow 1987 EUC-KR that a standards-literal decoder would apply and choke on.
# And its `Decoder` is a streaming state machine: a multi-byte character split
# across two reads of a socket is the normal case, not the exception, and the
# partial sequence has to survive between chunks.
encoding_rs = "0.8"

futures = "0.3"
async-trait = "0.1"
bitflags = "2"
tempfile = "3"
# Unix-only, and used only where a raw syscall is unavoidable: clearing
# `O_NONBLOCK` on a pty master, and reading the passwd entry.
libc = "0.2"

# --- local pty, Windows only ---
# `alacritty_terminal` does have a ConPTY backend, but it is built around
# alacritty's own IOCP poller and cannot be driven by a blocking reader thread
# the way its unix `tty` module can. wezterm's pty crate wraps ConPTY behind
# plain `Read`/`Write`, which is what `rulogman-pty`'s driver is shaped for. Its
# default feature set is empty — the optional `serde_support` would pull serde
# into a crate that never serialises anything — so nothing needs turning off.
portable-pty = "0.9"

# --- localization ---
# `rust-i18n` compiles `crates/rulogman-app/locales/*.yml` into the binary, so
# there is no runtime asset to ship; `sys-locale` is only consulted when the
# user has not pinned a language in `settings.json`.
rust-i18n = "4"
sys-locale = "0.3"

# --- async runtime (SSH transport only) ---
# `fs` is needed by the SFTP layer only: file transfers stream through
# `tokio::fs` so a multi-gigabyte copy never blocks the session worker.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
] }

# --- SSH.  NOTE: default features pull in `aws-lc-rs`, whose build requires
# NASM on Windows.  The `ring` backend builds everywhere with no extra tooling. ---
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }

# --- SFTP.  Rides on a russh channel with the `sftp` subsystem requested, so
# it inherits the transport (and the crypto backend) chosen above. ---
russh-sftp = "2.3"

# --- SHA-256, and only in a test. The SFTP end-to-end suite tags the Docker
# image it builds after the SHA-256 of the Dockerfile that describes it, so an
# edited Dockerfile asks for a tag that is not there yet and is therefore built.
# The self-updater used to be the other caller and is `rugpui-shell`'s now.
#
# Already linked as the crypto backend of `russh`, so naming it adds a
# dependency edge and not a crate. ---
ring = "0.17"

# --- terminal emulation (same engine Zed uses) ---
alacritty_terminal = "0.26"

# --- GUI: Zed's GPU-accelerated UI framework ---
# Two crates, one revision, and the revision has to be spelled out in both: a
# git dependency is identified by URL *and* revision, so naming the same commit
# twice is what makes them one source rather than two checkouts of the same
# repository. See the patch table at the top of this file for why a revision at
# all, and for what `rugpui`'s vendored crates put back on top of it.
#
# `gpui` is the platform-independent core, and everything the application
# writes is against it. `gpui_platform` is the façade that links a backend in
# and starts it — `application()` where 0.2.2 had `Application::new()`. Its
# features are empty by default and the backend inherits them, so the two
# display servers Linux might be running under have to be asked for by name;
# `font-kit` is macOS's text stack and is inert elsewhere.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", features = [
    "font-kit",
    "wayland",
    "x11",
] }

# --- the widget kit, and the shell above it ---
# `rugpui` is the gpui widget kit rulogman shares with the sibling database
# tools: the theme layer, the text input, the tab strip, the menus, the
# dialogs. Every view in `rulogman-app` is built out of it, and nothing in it
# knows what a session or a terminal is.
#
# `rugpui-editor` is the text surface a file opens in — the rope, the incremental
# syntax cache, the find bar and the eighteen languages it lexes. rulogman had
# a copy of its own until this was published, and the copy is what it replaced.
# `custom-syntax` is what makes a language definable in a file rather than in
# code — it is the whole of the `syntaxes` directory, and the definition files
# rulogman ships. Off by default there because it costs a YAML reader, which is
# a cost this application was already paying.
#
# `rugpui-shell` is the layer *above* the widgets, and it is here for the same
# reason the kit is: the window that draws its own title bar, the self-updater,
# the about and update dialogs, the split-pane tree, the palette editor and the
# pieces a settings form is built out of were each written once here and then
# copied twice. It knows nothing about rulogman — the name, the version, the
# release endpoints, the payload, the words and the ignored-release tag are all
# injected by `main` at start-up.
#
# All three are built on the gpui the patch table at the top of this file points
# at, and all three are taken at that same revision; see the comment there for
# why that has to hold.
rugpui = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f" }
rugpui-editor = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f", features = [
    "custom-syntax",
] }
rugpui-shell = { git = "https://github.com/xcomart/rugpui", rev = "ee19d479f4ee4c59f49e4c0cf5f9522a4c24777f" }

# --- internal crates ---
rulogman-core = { path = "crates/rulogman-core" }
rulogman-pty = { path = "crates/rulogman-pty" }
rulogman-ssh = { path = "crates/rulogman-ssh" }
rulogman-term = { path = "crates/rulogman-term" }

[profile.dev]
# gpui + its dependency tree is large; keep debug builds usable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
