# Publish the project page in site/ to GitHub Pages.
#
# The page reuses the README's screenshots and the application icon instead of
# keeping copies of them: the build job puts site/, docs/screenshots/ and
# assets/icon.svg together in one directory and deploys that. The repository's
# Pages source has to be set to "GitHub Actions" for the deploy job to succeed.
#
# Third-party actions are pinned to a full commit SHA, with the release that
# SHA belongs to in a trailing comment; bump both together.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - assets/icon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp site/* _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp assets/icon.svg _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
