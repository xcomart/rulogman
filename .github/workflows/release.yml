# Build release binaries for a version tag and attach them to a GitHub
# Release. Trigger with:
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# The build matrix only uploads artifacts; a single publish job creates the
# release afterwards. When each build job published directly, all three ran
# generate_release_notes and the release body carried the same changelog
# line three times.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      # gpui's build script compiles HLSL shaders with fxc.exe from the
      # Windows SDK. It only looks on PATH and at one hardcoded location, so
      # point it at whatever SDK the runner image actually carries.
      - name: Locate fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p rulogman-app --target ${{ matrix.target }}

      # A bare Mach-O binary cannot carry an icon; macOS wants an .app bundle
      # with an Info.plist and an .icns.
      #
      # The bundle is ad-hoc signed (`codesign --sign -`): no Apple Developer
      # account, no secrets, and no identity in the signature. That is not
      # notarization and it does not satisfy Gatekeeper, so a downloaded copy
      # arrives quarantined and the first launch is refused. Since macOS 15
      # right-click -> Open no longer bypasses that for unnotarized apps;
      # what works is `xattr -r -d com.apple.quarantine /Applications/rulogman.app`,
      # or System Settings -> Privacy & Security -> Open Anyway after one
      # failed launch — the README's Installing section walks users through
      # both. What it buys is one
      # signature over the bundle as a whole, sealing the Info.plist we just
      # wrote where the linker's own ad-hoc signature covers the executable
      # alone: from here nothing in the bundle can change without
      # `codesign --verify` noticing. Same tamper seal the Windows step settles
      # for, minus the certificate.
      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="rulogman.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/rulogman" "$app/Contents/MacOS/"
          cp assets/icon.icns "$app/Contents/Resources/rulogman.icns"
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # --deep is deprecated for signing and pointless here (the bundle has
          # no nested code), but it is still the documented way to verify one.
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          staging="rulogman-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$staging"
          cp -R "$app" README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

          # Transitional: a second copy under the pre-rename asset name, so
          # copies of the app still called `logman` can auto-update onto this
          # release. Their updater asks for `logman-<tag>-<target>.tar.gz` and
          # expects a `logman.app` inside it. Delete this block, and the
          # `$legacy` entry in ASSET below, in the release after this one.
          legacy_app="logman.app"
          mkdir -p "$legacy_app/Contents/MacOS" "$legacy_app/Contents/Resources"
          # Contents/MacOS must hold the executable and nothing else: codesign
          # reads any other file there as nested code and refuses to seal the
          # bundle. Hence one binary, named after CFBundleExecutable below.
          cp "target/${{ matrix.target }}/release/rulogman" "$legacy_app/Contents/MacOS/logman"
          cp assets/icon.icns "$legacy_app/Contents/Resources/logman.icns"
          # `<string>rulogman</string>` on its own is exactly the four keys that
          # have to follow the old names — CFBundleName, CFBundleDisplayName,
          # CFBundleExecutable and CFBundleIconFile. CFBundleIdentifier
          # (`com.aihouse.rulogman`) and the usage description are longer
          # strings, so they survive the substitution untouched: the identifier
          # is deliberately the new one, since settings and keychain entries
          # follow it.
          sed -e "s/__VERSION__/$version/g" \
              -e "s|<string>rulogman</string>|<string>logman</string>|g" \
              packaging/macos/Info.plist > "$legacy_app/Contents/Info.plist"
          plutil -lint "$legacy_app/Contents/Info.plist"
          codesign --force --sign - "$legacy_app"
          codesign --verify --deep --strict "$legacy_app"
          legacy="logman-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$legacy"
          cp -R "$legacy_app" README.md "$legacy/"
          tar czf "$legacy.tar.gz" "$legacy"

          {
            echo "ASSET<<EOF"
            echo "$staging.tar.gz"
            echo "$legacy.tar.gz"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # Linux gets the binary plus a desktop entry, hicolor icons and a
      # per-user install script; install.sh puts everything under ~/.local.
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          staging="rulogman-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging/icons"
          cp "target/${{ matrix.target }}/release/rulogman" "$staging/"
          cp README.md packaging/linux/com.aihouse.rulogman.desktop "$staging/"
          install -m755 packaging/linux/install.sh "$staging/install.sh"
          cp assets/icon-128.png "$staging/icons/rulogman-128.png"
          cp assets/icon-256.png "$staging/icons/rulogman-256.png"
          cp assets/icon.svg "$staging/icons/rulogman.svg"
          tar czf "$staging.tar.gz" "$staging"

          # Transitional: the same tree under the pre-rename asset name, so
          # copies still called `logman` can auto-update onto this release.
          # Their updater asks for `logman-<tag>-<target>.tar.gz` and replaces
          # the binary it finds named `logman`. The new-name binary, desktop
          # entry, icons and install.sh come along unchanged, so the archive is
          # still installable by hand. Delete this block, and the `$legacy`
          # entry in ASSET below, in the release after this one.
          legacy="logman-${{ github.ref_name }}-${{ matrix.target }}"
          cp -R "$staging" "$legacy"
          cp "target/${{ matrix.target }}/release/rulogman" "$legacy/logman"
          tar czf "$legacy.tar.gz" "$legacy"

          {
            echo "ASSET<<EOF"
            echo "$staging.tar.gz"
            echo "$legacy.tar.gz"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # signtool.exe ships with the Windows SDK and is not on PATH, so it needs
      # the same treatment as fxc.exe above.
      - name: Locate signtool.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' }
          # Versioned SDK directories (bin\10.0.26100.0\x64) sort newest last;
          # the legacy unversioned bin\x64 copy is only a fallback because it
          # can predate the SDK actually installed on the image.
          $signtool = $candidates |
            Where-Object { $_.FullName -match '\\bin\\10\.[0-9.]+\\x64\\' } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { $signtool = $candidates | Select-Object -First 1 }
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Authenticode-sign the exe with a self-signed certificate. This is a
      # tamper seal, not a reputation: the signing root is trusted by nobody,
      # so SmartScreen still shows "Windows protected your PC" and the
      # publisher still reads as unknown. It does let users compare the
      # certificate thumbprint across releases and it keeps the timestamp, so
      # the signature outlives the certificate's own validity window.
      #
      # The secrets are mapped into env rather than tested in `if:` because the
      # `secrets` context is not available in step-level `if:` expressions.
      # A missing certificate therefore skips signing instead of failing the
      # build, which keeps forks and pre-secret tags releasable.
      - name: Sign (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host "signing skipped (no certificate secret)"
            exit 0
          }
          # The retry loop below reads $LASTEXITCODE itself, so keep pwsh from
          # throwing on the first non-zero signtool exit.
          $PSNativeCommandUseErrorActionPreference = $false
          # Resolve-Path both normalises the separators signtool sees and fails
          # loudly if the build output is not where it is expected.
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/rulogman.exe").Path
          $pfx = Join-Path $env:RUNNER_TEMP "rulogman-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:PFX_BASE64 -replace '\s', '')))
            # The timestamp authority is a third-party service; give it a
            # couple of retries before failing the release over a blip.
            $signed = $false
            foreach ($attempt in 1..3) {
              & $env:SIGNTOOL sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
              if ($LASTEXITCODE -eq 0) { $signed = $true; break }
              Write-Host "signtool exited $LASTEXITCODE on attempt $attempt of 3"
              if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
            }
            if (-not $signed) { throw "signtool sign failed" }
          } finally {
            # The decoded key must not survive the step, failure included.
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          # `signtool verify /pa` would fail on purpose here: chain validation
          # ends at an untrusted root. Check that a signature is attached and
          # matches the file instead, which is all a self-signed seal can claim.
          $sig = Get-AuthenticodeSignature $exe
          $status = [string]$sig.Status
          if (-not $sig.SignerCertificate) { throw "no signature attached to $exe" }
          if ($status -eq 'NotSigned' -or $status -eq 'HashMismatch') {
            throw "authenticode check failed: $status"
          }
          # UnknownError is what an untrusted root reports; anything else here
          # is informational only.
          Write-Host "signed by $($sig.SignerCertificate.Subject) (status: $status)"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "rulogman-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rulogman.exe" $staging
          Copy-Item README.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

          # Transitional: a second copy under the pre-rename asset name, so
          # copies still called `logman` can auto-update onto this release.
          # Their updater asks for `logman-<tag>-<target>.zip` and unpacks
          # `logman.exe` from it. Authenticode signs the file's bytes and not
          # its name, so this copy of the already-signed exe stays valid.
          # Delete this block, and the `$legacy` entry in ASSET below, in the
          # release after this one.
          $legacy = "logman-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $legacy | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rulogman.exe" "$legacy/logman.exe"
          Copy-Item README.md $legacy
          Compress-Archive -Path $legacy -DestinationPath "$legacy.zip"

          @("ASSET<<EOF", "$staging.zip", "$legacy.zip", "EOF") |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # actions/checkout peels annotated tags to plain commits; re-fetch the
      # real tag object so its message is readable.
      - name: Read the tag annotation
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > release-body.md
          # A lightweight tag has no message; fall back to the subject line.
          if ! grep -q '[^[:space:]]' release-body.md; then
            git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}" > release-body.md
          fi
          cat release-body.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: dist/*
