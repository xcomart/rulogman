# Build release binaries for a version tag and attach them to a GitHub
# Release. Trigger with:
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# The build matrix only uploads artifacts; a single publish job creates the
# release afterwards. When each build job published directly, all three ran
# generate_release_notes and the release body carried the same changelog
# line three times.
#
# Before anything is built, `verify` refuses a tag that does not match the
# workspace version or that points at a commit `main` does not contain, and
# `test` runs the Linux test suite on the tagged commit; `publish` waits for
# both. Only `publish` can write to the repository. Next to the archives it
# uploads SHA256SUMS, one `sha256sum` line per asset.
#
# A manual run (`gh workflow run release.yml --ref dev`, or "Run workflow" on
# the Actions tab) builds the same archives and installers from a branch and
# stops there: `verify` names them after the branch and commit instead of a
# tag, and `test`, `publish`, `winget` and `homebrew` are skipped -- CI
# already tested the branch, and a branch build is not a release. Fetch the
# result with `gh run download <run-id>`; each target is an artifact named
# `release-<target>`.
#
# Six targets, x86_64 and aarch64 on each of Linux, Windows and macOS, each
# built on a hosted runner of its own architecture rather than
# cross-compiled, so the smoke tests below run the very binaries that ship.
# Linux ships twice: the tarball, and an AppImage built from the same tree.
#
# Third-party actions are pinned to a full commit SHA, with the release that
# SHA belongs to in a trailing comment; bump both together.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the publish job asks for write access on its own.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same pin as ci.yml: the shipped binaries are built by the toolchain CI
  # tested with.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  # A tag is a promise about two things this job can check before an hour of
  # builds is spent on it: that it names the version the binaries will report
  # (the workspace `version`, which the updater compares against the tag), and
  # that it was cut from what was merged into `main`, as the release procedure
  # requires -- not from a `dev` commit that never got there.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # What the archives and installers are named after -- the tag, or for a
      # manual run the branch and short commit -- and the bare workspace
      # version the bundle metadata and the installer's numeric fields carry.
      label: ${{ steps.meta.outputs.label }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag matches the workspace version
        id: meta
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            label="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
            echo "label=$label" >> "$GITHUB_OUTPUT"
            echo "manual build of $GITHUB_REF_NAME ($GITHUB_SHA) as $label, version $version; nothing will be published"
            exit 0
          fi
          echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches the workspace version"

      - name: Tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not contained in origin/main; merge the release into main before tagging"
            exit 1
          fi
          echo "$GITHUB_SHA is contained in origin/main"

  # The tagged commit's test suite, once more, before anything is published:
  # CI ran it on the branch, but a tag can be pushed on any commit. Linux only,
  # mirroring the Linux leg of ci.yml.
  test:
    name: test (linux)
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: test
        run: cargo test --workspace --locked

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # The Linux binary is built inside Debian 12, so it can need no glibc newer
    # than Debian 12's 2.36; what it does need is 2.35, the floor the README
    # and the release notes promise (Ubuntu 22.04, Debian 12 and later). Built
    # on the runner itself it took the runner's glibc as its floor and refused
    # to start anywhere older. The other targets have no container entry, and
    # an empty one runs on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each target on a runner of its own architecture. macos-15-intel is
        # the last Intel image GitHub offers; once it is retired the x86_64
        # macOS build has to move to a cross-compile on Apple Silicon.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: debian:12
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:12
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      # Before the checkout: debian:12 has no git, without which the checkout
      # falls back to a tarball with no repository around it, and no compiler
      # either. The job runs as root in the container, so there is no sudo.
      # `file` is for appimagetool, which refuses to run without it. There are
      # no libxkbcommon development packages: xkbcommon is built from source
      # and linked in below, and their .so links could take its place at link
      # time. bison, ninja-build, python3 and libxcb-xkb-dev are for that build.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl file git \
            libwayland-dev libfontconfig1-dev libfreetype-dev \
            bison ninja-build python3 libxcb-xkb-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gpui_windows' build script compiles HLSL shaders with fxc.exe from
      # the Windows SDK. It looks on PATH and then at whatever the registry
      # records, so point it at the SDK the runner image actually carries:
      # the copy built for the runner's own architecture, and the x64 one,
      # which Windows on ARM runs emulated, when the SDK has no other.
      - name: Locate fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $all = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue
          $native = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $fxc = $null
          foreach ($arch in @($native, 'x64')) {
            if ($fxc) { break }
            $fxc = $all | Where-Object { $_.FullName -match "\\$arch\\" } |
              Sort-Object FullName | Select-Object -Last 1
          }
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The *-pc-windows-msvc targets link the CRT dynamically by
      # default, so the resulting rulogman.exe needs VCRUNTIME140.dll and the
      # api-ms-win-crt-* forwarders at load time. Inno Setup only packages the
      # exe and README, and the zip is just the exe on its own, so neither
      # artifact carries the VC++ redistributable — a machine that has never
      # installed it (the winget-pkgs validation VM, in practice) fails to
      # even start rulogman.exe with STATUS_DLL_NOT_FOUND (0xC0000135).
      # Statically linking the CRT folds those DLLs into the binary, so it
      # runs standalone on a bare Windows install, whether launched from the
      # zip or the installer. Only this OS's build needs it, hence a
      # dedicated step rather than a matrix-wide `env:` (which would also
      # apply the flag, harmlessly but pointlessly, to Linux and macOS).
      # The winget manifest's Microsoft.VCRedist.2015+.x64 dependency
      # (packaging/winget/*/Xcomart.Rulogman.installer.yaml) stays declared
      # regardless: it is a no-op once the runtime is already on the machine,
      # and a safety net if a future build ever drops this flag. Swatinem/
      # rust-cache@v2 keys its cache on RUSTFLAGS, so toggling this between
      # runs cannot serve a stale dynamically-linked object into a
      # statically-linked build or vice versa.
      - name: Statically link the CRT (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The Linux counterpart: xkbcommon is linked in instead of loaded from
      # the system, because its X11 half, libxkbcommon-x11, is missing from
      # most desktop installs and the binary would not start without it.
      # packaging/linux/static-xkbcommon.sh says why all of xkbcommon goes in,
      # libxcb-xkb with it. The search path is in RUSTFLAGS before rust-cache
      # computes its key, so a cache from a dynamically linked build is never
      # reused for this one.
      - name: Build static xkbcommon (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/xkbcommon-static"
          packaging/linux/static-xkbcommon.sh "$dir"
          echo "RUSTFLAGS=-L native=$dir" >> "$GITHUB_ENV"

      # The hosted runners come with rustup; debian:12 does not.
      - name: Install rustup (linux)
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"

      # Keyed on the container as well: a cache saved by a build on the runner
      # itself holds C objects compiled against the runner's newer glibc
      # headers, and reusing them would bring its glibc floor straight back.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.container }}

      - name: Build
        run: cargo build --release --locked -p rulogman-app --target ${{ matrix.target }}

      # What the container is for, checked rather than assumed: a binary that
      # asks for a glibc newer than the 2.35 the README and the release notes
      # promise fails the release instead of failing to start on a user's
      # machine. Weak symbols count too: the loader refuses a glibc that lacks
      # a version the binary names, even when only weak symbols name it.
      - name: Check the glibc floor (linux)
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/rulogman"
          needed=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -V | tail -n 1)
          echo "$bin needs glibc $needed"
          if [ "$(printf '%s\n' "$needed" 2.35 | sort -V | tail -n 1)" != 2.35 ]; then
            echo "::error::$bin needs glibc $needed, newer than the documented 2.35"
            exit 1
          fi

      # And the libraries the loader has to find, against the short list the
      # README and install.sh promise: glibc, libgcc_s and libxcb. xkbcommon
      # and libxcb-xkb are linked in, so a binary that still asks for either
      # fails here; anything new that turns up has to be added to the README
      # and install.sh, and to this list, before a release can ship it.
      - name: Check the linked libraries (linux)
        if: runner.os == 'Linux'
        run: |
          bin="target/${{ matrix.target }}/release/rulogman"
          needed=$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          echo "$bin loads:" $needed
          unexpected=
          for lib in $needed; do
            case "$lib" in
              libc.so.6 | libm.so.6 | libgcc_s.so.1 | libxcb.so.1 | ld-linux-*.so.*) ;;
              *) unexpected="$unexpected $lib" ;;
            esac
          done
          if [ -n "$unexpected" ]; then
            echo "::error::$bin needs$unexpected, which the README and install.sh do not promise"
            exit 1
          fi

      # A bare Mach-O binary cannot carry an icon; macOS wants an .app bundle
      # with an Info.plist and an .icns.
      #
      # The bundle is ad-hoc signed (`codesign --sign -`): no Apple Developer
      # account, no secrets, and no identity in the signature. That is not
      # notarization and it does not satisfy Gatekeeper, so a downloaded copy
      # arrives quarantined and the first launch is refused. Since macOS 15
      # right-click -> Open no longer bypasses that for unnotarized apps;
      # what works is `xattr -r -d com.apple.quarantine /Applications/rulogman.app`,
      # or System Settings -> Privacy & Security -> Open Anyway after one
      # failed launch — the README's Installing section walks users through
      # both. What it buys is one
      # signature over the bundle as a whole, sealing the Info.plist we just
      # wrote where the linker's own ad-hoc signature covers the executable
      # alone: from here nothing in the bundle can change without
      # `codesign --verify` noticing. Same tamper seal the Windows step settles
      # for, minus the certificate.
      - name: Package (macos)
        if: runner.os == 'macOS'
        run: |
          version="${{ needs.verify.outputs.version }}"
          app="rulogman.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/rulogman" "$app/Contents/MacOS/"
          cp assets/icon.icns "$app/Contents/Resources/rulogman.icns"
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # The Services menu titles in the user's language. AppKit reads a
          # service's title out of `ServicesMenu.strings` in whichever `.lproj`
          # matches, keyed by the English string the Info.plist declared, and
          # falls back to that string when there is none — so a bundle without
          # these still works, in English. There is one per language rulogman
          # itself is translated into, `zh-CN` spelt `zh-Hans` because that is
          # the name AppKit knows the localisation by.
          #
          # Copying them has a second effect worth knowing about, and it is a
          # welcome one: an `.lproj` directory is what tells AppKit the bundle
          # is localised for that language at all, so from here the standard
          # menu strings the framework supplies — the *Services* submenu's own
          # title, *Hide*, *Quit*, the window buttons' tooltips — come out in
          # the same language as the rest of the application instead of in
          # English. Nothing else in the bundle is localised through these
          # directories: rulogman's own strings are compiled into the binary.
          cp -R packaging/macos/*.lproj "$app/Contents/Resources/"
          for strings in "$app"/Contents/Resources/*.lproj/ServicesMenu.strings; do
            plutil -lint "$strings"
          done
          # --deep is deprecated for signing and pointless here (the bundle has
          # no nested code), but it is still the documented way to verify one.
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          staging="rulogman-${{ needs.verify.outputs.label }}-${{ matrix.target }}"
          mkdir "$staging"
          cp -R "$app" README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"

          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      # Linux gets the binary plus a desktop entry, hicolor icons and a
      # per-user install script; install.sh puts everything under ~/.local.
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          staging="rulogman-${{ needs.verify.outputs.label }}-${{ matrix.target }}"
          mkdir -p "$staging/icons"
          cp "target/${{ matrix.target }}/release/rulogman" "$staging/"
          cp README.md packaging/linux/com.aihouse.rulogman.desktop "$staging/"
          install -m755 packaging/linux/install.sh "$staging/install.sh"
          cp assets/icon-128.png "$staging/icons/rulogman-128.png"
          cp assets/icon-256.png "$staging/icons/rulogman-256.png"
          cp assets/icon.svg "$staging/icons/rulogman.svg"
          tar czf "$staging.tar.gz" "$staging"

          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      # Linux also ships as an AppImage: one file that runs in place, for
      # whoever would rather not run install.sh. It is the staged tree less
      # what only the installer needs -- install.sh, icons/, the README. The
      # desktop entry and the icon go at the top, where the format looks for
      # them, the hicolor icons under usr/share for desktop integration tools,
      # and AppRun is a link to the program, so /proc/self/exe is the program
      # itself.
      #
      # Both downloads are pinned releases, checked against the SHA256s their
      # GitHub releases list: appimagetool, which runs here without FUSE by
      # extracting itself (APPIMAGE_EXTRACT_AND_RUN), and the type2 runtime it
      # puts at the front of the image, handed over with --runtime-file so it
      # does not fetch whichever one is newest. To upgrade, change a version
      # and its two SHA256s together. appimagetool only embeds zsync update
      # information on CI when GITHUB_TOKEN is in its environment, which this
      # step leaves out: the in-app updater replaces the image itself
      # (rugpui-shell's update.rs).
      #
      # The image is then run once, extracted for the same reason, and has to
      # report the version being released.
      #
      # bash by name: inside the container a step's default shell is sh, which
      # has no pipefail, and the first release run stopped right there.
      - name: Build the AppImage (linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGE_RUNTIME_VERSION: "20251108"
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          arch="${target%%-*}"
          case "$arch" in
            x86_64)
              tool_sha256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              runtime_sha256=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
              ;;
            aarch64)
              tool_sha256=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              runtime_sha256=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
              ;;
            *)
              echo "::error::no AppImage tooling is pinned for $arch"
              exit 1
              ;;
          esac
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$tools/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$arch.AppImage"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$tools/runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-$arch"
          printf '%s  %s\n' "$tool_sha256" "$tools/appimagetool" "$runtime_sha256" "$tools/runtime" |
            sha256sum --check --strict
          chmod +x "$tools/appimagetool"

          appdir="$RUNNER_TEMP/rulogman.AppDir"
          rm -rf "$appdir"
          cp -R "$STAGING" "$appdir"
          rm -rf "$appdir/install.sh" "$appdir/icons" "$appdir/README.md"
          ln -s rulogman "$appdir/AppRun"
          cp assets/icon-256.png "$appdir/rulogman.png"
          for size in 128 256; do
            install -D -m644 "assets/icon-$size.png" "$appdir/usr/share/icons/hicolor/${size}x${size}/apps/rulogman.png"
          done
          install -D -m644 assets/icon.svg "$appdir/usr/share/icons/hicolor/scalable/apps/rulogman.svg"

          image="$STAGING.AppImage"
          ARCH="$arch" APPIMAGE_EXTRACT_AND_RUN=1 "$tools/appimagetool" --no-appstream \
            --runtime-file "$tools/runtime" "$appdir" "$image"

          expected="rulogman ${{ needs.verify.outputs.version }}"
          reported=$(APPIMAGE_EXTRACT_AND_RUN=1 "./$image" --version)
          if [ "$reported" != "$expected" ]; then
            echo "::error::$image --version printed '$reported', expected '$expected'"
            exit 1
          fi
          echo "$image reports $reported"

          # The tarball and the image, so ASSET becomes a list.
          {
            echo "ASSET<<RELEASE_ASSETS"
            echo "$ASSET"
            echo "$image"
            echo "RELEASE_ASSETS"
          } >> "$GITHUB_ENV"

      # signtool.exe ships with the Windows SDK and is not on PATH, so it needs
      # the same treatment as fxc.exe above.
      - name: Locate signtool.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $all = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
          # The runner's own architecture first and x64 after, as for fxc.exe.
          $native = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $signtool = $null
          foreach ($arch in @($native, 'x64')) {
            if ($signtool) { break }
            $candidates = $all | Where-Object { $_.FullName -match "\\$arch\\" }
            # Versioned SDK directories (bin\10.0.26100.0\x64) sort newest last;
            # the legacy unversioned bin\x64 copy is only a fallback because it
            # can predate the SDK actually installed on the image.
            $signtool = $candidates |
              Where-Object { $_.FullName -match "\\bin\\10\.[0-9.]+\\$arch\\" } |
              Sort-Object FullName | Select-Object -Last 1
            if (-not $signtool) { $signtool = $candidates | Select-Object -First 1 }
          }
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Authenticode-sign the exe with a self-signed certificate. The long form
      # of why — that this is a tamper seal and not a reputation, that
      # SmartScreen is unmoved by it, and why a missing secret has to skip
      # rather than fail — now lives at the top of packaging/windows/sign.ps1,
      # because the installer built further down needs the identical treatment
      # and the retry-and-cleanup dance is not worth having twice.
      #
      # The secrets are still mapped into env here rather than tested in `if:`:
      # the `secrets` context is not available in step-level `if:` expressions,
      # so the "is a certificate configured" question can only be asked inside
      # the script.
      - name: Sign (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./packaging/windows/sign.ps1 "target/${{ matrix.target }}/release/rulogman.exe"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "rulogman-${{ needs.verify.outputs.label }}-${{ matrix.target }}"
          New-Item -ItemType Directory $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rulogman.exe" $staging
          Copy-Item README.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

          @("ASSET<<EOF", "$staging.zip", "EOF") |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The installer step below wraps this very tree, so it needs to know
          # where it is rather than reconstructing the name a second time.
          "STAGING=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The other Windows artifact: an Inno Setup installer wrapped around the
      # tree the step above just staged. The zip stays — the in-app updater
      # downloads and unpacks it (crates/rulogman-app/src/update.rs), so
      # removing it would break every copy already installed. The installer is
      # what makes the package installable by winget: unzipping registers
      # nothing with Windows, and winget reads the "Apps & features" registry
      # entry to know which version is present and how to remove or upgrade it.
      # No ARP entry, no winget package.
      #
      # Inno Setup 6 comes and goes from the windows-latest image, so neither
      # "it is there" nor "it is not" is safe to assume: look in both Program
      # Files roots first and fall back to Chocolatey, which the image does
      # carry. `$version` is the bare workspace version because VersionInfoVersion
      # in the script is a numeric quad and refuses a prefix, while the output
      # file name keeps the label (the tag) verbatim so it matches the zip
      # beside it.
      - name: Build the installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Both Program Files roots, and a wildcard on the version folder so a
          # future "Inno Setup 7" (or whatever Chocolatey happens to lay down)
          # is still found rather than silently missed.
          function Find-Iscc {
            @("${env:ProgramFiles(x86)}", $env:ProgramFiles) |
              Where-Object { $_ } |
              ForEach-Object { Join-Path $_ "Inno Setup *\ISCC.exe" } |
              Get-Item -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup is not on this image; installing it with Chocolatey"
            choco install innosetup --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found, even after installing Inno Setup" }
          Write-Host "compiling with $iscc"

          $version = "${{ needs.verify.outputs.version }}"
          $base = "rulogman-${{ needs.verify.outputs.label }}-${{ matrix.target }}-setup"
          # The script's ArchitecturesAllowed: x64compatible for the x64 build,
          # which also installs under emulation on ARM64, arm64 for the native
          # one.
          $arch = if ("${{ matrix.target }}" -like "aarch64-*") { "arm64" } else { "x64compatible" }
          # ISCC resolves a relative OutputDir against the script's own
          # directory, which would bury the installer in packaging\windows\.
          # Absolute paths for both ends, so it lands next to the zip.
          $source = (Resolve-Path $env:STAGING).Path
          $out = (Get-Location).Path
          & $iscc "/DVersion=$version" "/DArch=$arch" "/DSourceDir=$source" "/DOutputDir=$out" "/DOutputBaseFilename=$base" packaging\windows\rulogman.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }

          $installer = Join-Path $out "$base.exe"
          if (-not (Test-Path $installer)) { throw "ISCC reported success but produced no $base.exe" }
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Append the setup .exe to the list of files to upload. ASSET is
          # rewritten from whatever the packaging step put in it rather than
          # from the archive names spelled out again.
          $assets = @($env:ASSET -split "`r?`n" | Where-Object { $_ })
          @("ASSET<<EOF") + $assets + @("$base.exe", "EOF") |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Same certificate, same script, same caveats as the executable: the seal
      # is self-signed, so SmartScreen greets the installer exactly as it
      # greets the exe. Signing has to happen after ISCC runs, since the
      # installer is a fresh executable that embeds the payload rather than a
      # container copied around it.
      - name: Sign the installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./packaging/windows/sign.ps1 "$env:INSTALLER"

      # Everything the installer exists for lives in side effects that no file
      # listing can show: the registry entry winget reads, and an uninstaller
      # that can undo the install. So run it for real, unattended, into a
      # throwaway directory, and then look at what it left behind.
      #
      # The uninstall half is best-effort on purpose. Inno's uninstaller copies
      # itself to a temp directory and relaunches from there so it can delete
      # its own folder, which means the process Start-Process waited on has
      # already exited while the real work is still going. Polling for the
      # directory to vanish is the only handle available, and a slow runner
      # losing that race is not a reason to fail a release — the load-bearing
      # claim, that an uninstaller and an ARP entry exist at all, is already
      # proven above. So a timeout warns rather than throws.
      - name: Smoke-test the installer (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "rulogman-install-check"
          $log = Join-Path $env:RUNNER_TEMP "rulogman-install.log"
          $setup = Start-Process -FilePath $env:INSTALLER -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/LOG=$log"
          if ($setup.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "the installer exited $($setup.ExitCode)"
          }

          if (-not (Test-Path (Join-Path $dir "rulogman.exe"))) {
            throw "the installed tree is missing rulogman.exe"
          }

          # The whole point of shipping an installer: winget looks the package
          # up here. The key name is the AppId from rulogman.iss with Inno's
          # "_is1" suffix, under HKCU because the install is per-user.
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{D6066CD8-5F5D-4B13-AB5B-DAD7965FF725}_is1"
          $arp = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
          if (-not $arp) { throw "the install left no Add/Remove Programs entry at $key" }
          $version = "${{ needs.verify.outputs.version }}"
          if ($arp.DisplayVersion -ne $version) {
            throw "Add/Remove Programs says $($arp.DisplayVersion), expected $version"
          }
          Write-Host "registered as $($arp.DisplayName) $($arp.DisplayVersion) in $dir"

          $uninstaller = Join-Path $dir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "no uninstaller at $uninstaller" }
          Start-Process -FilePath $uninstaller -Wait `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $dir) {
            Write-Host "::warning::the uninstaller had not finished clearing $dir after 120s"
          } else {
            Write-Host "uninstall removed $dir"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/checkout peels annotated tags to plain commits; re-fetch the
      # real tag object so its message is readable.
      - name: Read the tag annotation
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > release-body.md
          # A lightweight tag has no message; fall back to the subject line.
          if ! grep -q '[^[:space:]]' release-body.md; then
            git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}" > release-body.md
          fi
          cat release-body.md

      # Every release states the Linux glibc floor the build job checks.
      - name: State the requirements
        run: |
          cat >> release-body.md <<'EOF'

          ## Requirements

          - **Linux**: glibc 2.35 or newer: Ubuntu 22.04, Debian 12 and later, or a distribution built on them, MX Linux 23 among them.
          - **Linux AppImage**: the same glibc, and FUSE to mount the image (the `fuse3` package, which desktop installs of those distributions include). Without FUSE, start it with `--appimage-extract-and-run`.
          EOF
          cat release-body.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # One `sha256sum` line per asset, so a download can be checked with
      # `sha256sum --check --ignore-missing SHA256SUMS`. Written outside dist/
      # first so the file does not list itself.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: dist/*

  # Push the new version to the Windows Package Manager repository, so that
  # `winget upgrade` sees a release the moment it is published instead of
  # whenever somebody remembers to open a pull request by hand.
  #
  # THIS JOB CANNOT CREATE THE PACKAGE. `wingetcreate update` edits manifests
  # that already exist in microsoft/winget-pkgs; if Xcomart.Rulogman were not
  # there it would fail with "package not found". The first submission was a
  # manual step, done once, from the manifests kept in packaging/winget/ —
  # packaging/winget/README.md walks through it. What the job needs is the
  # WINGET_PAT secret, a classic PAT with `public_repo` scope on an account
  # that has forked winget-pkgs.
  #
  # Without the secret the job does nothing and still succeeds, which is
  # deliberate: a release must not fail because a downstream package
  # repository is not ready. It does leave a warning on the run, though, so a
  # green job is not mistaken for a submitted package. The check happens in a
  # script rather than in a step-level `if:` for the same reason the signing
  # step does it that way — the `secrets` context does not exist in `if:`
  # expressions.
  winget:
    name: winget
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # wingetcreate does not look for a pull request that is already open for
      # the version, and opens another one regardless. That happens: a
      # third-party bot (pl4nty's winget-recipes) picks up GitHub releases and
      # submitted rudbman 0.3.7 on its own, and a rerun of this job would
      # meet its own earlier pull request. So skip the version when
      # winget-pkgs already has it, merged or in an open pull request whose
      # title names it — wingetcreate's and the bots' titles all carry the
      # identifier and the version as separate words.
      - name: Check what winget-pkgs already has
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=winget::winget submission skipped (no WINGET_PAT secret)"
            exit 0
          fi

          id=Xcomart.Rulogman
          export VERSION="${GITHUB_REF_NAME#v}"

          published=$(gh api repos/microsoft/winget-pkgs/contents/manifests/x/Xcomart/Rulogman --jq '.[].name')
          if grep -qxF "$VERSION" <<<"$published"; then
            echo "$id $VERSION is already in winget-pkgs; nothing to submit"
            exit 0
          fi

          pending=$(gh pr list --repo microsoft/winget-pkgs --state open --search "$id in:title" --limit 100 \
            --json title,url --jq '.[] | select(.title | split(" ") | any(. == env.VERSION)) | .url')
          if [ -n "$pending" ]; then
            echo "$id $VERSION is already waiting in winget-pkgs; nothing to submit:"
            echo "$pending"
            exit 0
          fi

          # wingetcreate only updates the installers a manifest already has,
          # and refuses a different number of them. So the first release with
          # an arm64 build adds that installer itself, a step further on, and
          # every later one hands wingetcreate both URLs. The newest published
          # version says which case this is.
          latest=$(grep -E '^[0-9]' <<<"$published" | sort -V | tail -n 1)
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/x/Xcomart/Rulogman/$latest/$id.installer.yaml" \
              -H 'Accept: application/vnd.github.raw' | grep -qE '^[[:space:]-]*Architecture:[[:space:]]*arm64'; then
            echo "arm64=listed" >> "$GITHUB_OUTPUT"
          fi

          echo "submit=true" >> "$GITHUB_OUTPUT"

      # The manifests are written here and submitted two steps further on,
      # rather than in one `wingetcreate update --submit`, because of
      # ReleaseNotes. wingetcreate copies the published version's manifests
      # and clears what belongs to one release (ReleaseNotes, ReleaseNotesUrl,
      # ReleaseDate) before it fills the new ones in, and it never fills
      # ReleaseNotes back in. winget-pkgs' validator compares a submission with
      # the published version and labels the pull request
      # Manifest-Metadata-Consistency when a field that version had is missing:
      # rudbman 0.3.7 went in through the bot above with the release body as
      # its notes, and rudbman's 0.3.8 pull request was held until they were
      # added by hand. Rulogman's published manifests carry no notes yet, but
      # one bot submission would put it in the same place, so every
      # submission carries the release body as its notes.
      - name: Write the winget manifests
        if: steps.check.outputs.submit == 'true'
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $base = "https://github.com/xcomart/rulogman/releases/download/$tag/rulogman-$tag"
          # Each URL names its architecture: both setup programs are the same
          # 32-bit Inno Setup stub, so nothing in the files tells them apart.
          $urls = @("$base-x86_64-pc-windows-msvc-setup.exe|x64")
          if ("${{ steps.check.outputs.arm64 }}" -eq "listed") {
            $urls += "$base-aarch64-pc-windows-msvc-setup.exe|arm64"
          }

          # Fetched straight from its GitHub release rather than through
          # `winget install wingetcreate`: the winget CLI itself is not
          # dependably present on a hosted runner (it ships with the Desktop
          # App Installer, which needs a logged-in user session), whereas a
          # plain download works everywhere. A fixed release, checked against
          # the SHA256 its GitHub release lists for wingetcreate.exe, rather
          # than the publisher's "latest" permalink: this binary is handed
          # WINGET_PAT, so it must be exactly the one that was reviewed. To
          # upgrade, change both lines together.
          $wingetcreateVersion = "v1.12.13.0"
          $wingetcreateSha256 = "24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea"
          $exe = Join-Path $env:RUNNER_TEMP "wingetcreate.exe"
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/$wingetcreateVersion/wingetcreate.exe" -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash
          if ($actual -ne $wingetcreateSha256) {
            throw "wingetcreate.exe $wingetcreateVersion has SHA256 $actual, expected $wingetcreateSha256"
          }

          # wingetcreate downloads each installer in $urls itself to compute
          # its SHA256, so the release assets must already be attached — hence
          # needs: publish. ReleaseNotesUrl and ReleaseDate are given rather
          # than left to its own lookup of the GitHub release, so neither can
          # go missing the way ReleaseNotes did; the date is the day the
          # release was published, in UTC. The token reads the published
          # manifests from winget-pkgs.
          $released = gh release view $tag --repo $env:GITHUB_REPOSITORY --json publishedAt --jq '.publishedAt[0:10]'
          if ($LASTEXITCODE -ne 0) { throw "gh release view exited $LASTEXITCODE" }
          & $exe update Xcomart.Rulogman --version $version --urls $urls `
            --release-notes-url "https://github.com/xcomart/rulogman/releases/tag/$tag" --release-date $released `
            --out (Join-Path $env:RUNNER_TEMP "winget") --token $env:WINGET_PAT
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited $LASTEXITCODE" }

      # The arm64 installer, for the first release that has one; see the
      # check above. Built from the same script as the x64 one, it carries
      # the same ProductCode, and its own VC++ runtime dependency in place of
      # the x64 one the manifest declares for every installer -- the same
      # safety net, since the build links the CRT statically.
      - name: Add the arm64 installer to the manifest
        if: steps.check.outputs.submit == 'true' && steps.check.outputs.arm64 != 'listed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=Xcomart.Rulogman
          tag="$GITHUB_REF_NAME"
          export NAME="rulogman-$tag-aarch64-pc-windows-msvc-setup.exe"
          sha256=$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output - |
            awk '$2 == ENVIRON["NAME"] { print toupper($1) }')
          if ! grep -qxE '[0-9A-F]{64}' <<<"$sha256"; then
            echo "::error title=winget::SHA256SUMS of $tag has no line for $NAME"
            exit 1
          fi

          manifest=$(find "$RUNNER_TEMP/winget" -name "$id.installer.yaml")
          test -f "$manifest"
          # Taken from the x64 installer when it lists one; at the root it
          # already applies to every installer.
          product=$(sed -n 's/^  ProductCode: //p' "$manifest" | tr -d '\r' | head -n 1)

          export NODE="$RUNNER_TEMP/arm64-installer.yaml"
          {
            echo "- Architecture: arm64"
            echo "  InstallerUrl: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$NAME"
            echo "  InstallerSha256: $sha256"
            if [ -n "$product" ]; then echo "  ProductCode: $product"; fi
            echo "  Dependencies:"
            echo "    PackageDependencies:"
            echo "    - PackageIdentifier: Microsoft.VCRedist.2015+.arm64"
          } > "$NODE"

          # Appended to the Installers list, which has to be the last thing
          # before ManifestType for that to be where the new entry lands, in
          # the file's own line endings. The submit step validates the result.
          # Indented like the entries already there.
          awk '
            BEGIN { node = ENVIRON["NODE"] }
            { eol = sub(/\r$/, "") ? "\r\n" : "\n" }
            last ~ /^Installers:/ && !indented && /^ *- / {
              match($0, /^ */); pad = substr($0, 1, RLENGTH); indented = 1
            }
            /^ManifestType:/ && !done {
              if (last !~ /^Installers:/ || !indented) exit 2
              while ((getline l < node) > 0) printf "%s%s%s", pad, l, eol
              done = 1
            }
            /^[A-Za-z]/ { last = $0 }
            { printf "%s%s", $0, eol }
            END { if (!done) exit 1 }
          ' "$manifest" > "$manifest.new"
          mv -f "$manifest.new" "$manifest"
          sed -n '/^Installers:/,/^ManifestType:/p' "$manifest"

      - name: Add the release notes to the manifest
        if: steps.check.outputs.submit == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=Xcomart.Rulogman
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-body.md"

          # Markdown to the plain text winget shows: no emphasis or code marks,
          # links as their text, "*" bullets as "-", this repository's pull
          # request links as #N, headings as plain lines with a blank line
          # before them, no other blank lines and no "Full Changelog" line.
          # Whole lines are kept while the notes fit winget's 10,000-character
          # limit (counted in bytes, never fewer); ReleaseNotesUrl links the
          # full text.
          LC_ALL=C awk -v pulls="https://github.com/$GITHUB_REPOSITORY/pull/" '
            { sub(/\r$/, ""); line = $0 }
            line ~ /^\*\*Full Changelog\*\*/ { next }
            {
              heading = sub(/^#+[ \t]+/, "", line)
              sub(/^\*[ \t]+/, "- ", line)
              gsub(/\*\*|`/, "", line)
              while (match(line, /\[[^]]*\]\([^)]*\)/)) {
                text = substr(line, RSTART + 1, RLENGTH - 1); sub(/\]\(.*$/, "", text)
                line = substr(line, 1, RSTART - 1) text substr(line, RSTART + RLENGTH)
              }
              while ((i = index(line, pulls)) > 0) {
                rest = substr(line, i + length(pulls)); match(rest, /^[0-9]+/)
                line = substr(line, 1, i - 1) "#" substr(rest, 1, RLENGTH) substr(rest, RLENGTH + 1)
              }
              sub(/^[ \t]+/, "", line); sub(/[ \t]+$/, "", line)
              if (line == "") next
              if (heading && n > 0) out[n++] = ""
              out[n++] = line
            }
            END {
              for (k = 0; k < n; k++) {
                size += length(out[k]) + (k > 0)
                if (size > 10000) break
                print out[k]
              }
            }
          ' "$RUNNER_TEMP/release-body.md" > "$RUNNER_TEMP/release-notes.txt"

          # Empty notes would go out as ReleaseNotes: "", which the validator
          # holds just as it holds a missing field.
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.txt"; then
            echo "::error title=winget::the release body of $GITHUB_REF_NAME gave no release notes"
            exit 1
          fi

          locale=$(find "$RUNNER_TEMP/winget" -name "$id.locale.en-US.yaml")
          test -f "$locale"

          # A literal block just before ReleaseNotesUrl, where the schema
          # lists it, in the file's own line endings. Any ReleaseNotes
          # wingetcreate wrote is dropped first, since what it carries over
          # from the published version is an empty string at best. The submit
          # step reads the manifests back, validates them and writes them out
          # again.
          #
          # The notes file is named through the environment rather than with
          # -v, because awk expands backslash escapes in a -v value. On the
          # Windows runner RUNNER_TEMP is D:\a\_temp: the \a became a bell,
          # getline found no such file, and rudbman 0.3.9 and rulogman 0.6.6
          # went out with ReleaseNotes: "". The END rule fails the step when
          # no line of notes went in, rather than submitting an empty block.
          NOTES="$RUNNER_TEMP/release-notes.txt" awk '
            BEGIN { notes = ENVIRON["NOTES"] }
            { eol = sub(/\r$/, "") ? "\r\n" : "\n" }
            skip && /^([ \t]|$)/ { next }
            { skip = 0 }
            /^ReleaseNotes:/ { skip = 1; next }
            !done && /^(ReleaseNotesUrl|ManifestType):/ {
              printf "ReleaseNotes: |-%s", eol
              while ((getline l < notes) > 0) {
                printf "%s%s", (l == "" ? "" : "  " l), eol
                if (l != "") lines++
              }
              done = 1
            }
            { printf "%s%s", $0, eol }
            END { if (!done || !lines) exit 1 }
          ' "$locale" > "$locale.new"
          mv -f "$locale.new" "$locale"
          sed -n '/^ReleaseNotes:/,/^ReleaseNotesUrl:/p' "$locale"

      # --prtitle is the title `update --submit` gave, which the check above
      # and the bots' titles agree on. --no-open because there is no browser on
      # a runner to show the pull request in.
      - name: Submit the manifests to winget-pkgs
        if: steps.check.outputs.submit == 'true'
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exe = Join-Path $env:RUNNER_TEMP "wingetcreate.exe"
          $dir = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "winget") -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "Xcomart.Rulogman.locale.en-US.yaml") } |
            Select-Object -First 1
          if (-not $dir) { throw "no Xcomart.Rulogman manifests under $env:RUNNER_TEMP\winget" }
          & $exe submit --prtitle "New version: Xcomart.Rulogman version $version" --no-open --token $env:WINGET_PAT $dir.FullName
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited $LASTEXITCODE" }

  # Point this application's cask in xcomart/homebrew-tap at the release just
  # published, so `brew install --cask xcomart/tap/rulogman` installs it from
  # now on. The tap is a repository of ours, not a shared one like
  # winget-pkgs: there is no pull request and no review, and the commit this
  # job pushes to its `main` is the whole update. That push runs the tap's own
  # Tests workflow, which installs the new version on a macOS runner.
  #
  # The cask carries the two macOS archives alone, Apple Silicon and Intel,
  # and their checksums are the ones `publish` wrote into SHA256SUMS rather
  # than hashes of a fresh download.
  # A rerun, or an older tag's run arriving late, leaves a cask that is
  # already at this version or a newer one as it is.
  #
  # Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained personal access token
  # with Contents: Read and write on xcomart/homebrew-tap alone, since
  # GITHUB_TOKEN cannot push to another repository. Without the secret the
  # job warns and succeeds, as the winget job does, so a release never fails
  # over it.
  homebrew:
    name: homebrew
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update the cask in xcomart/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
          CASK: rulogman
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=homebrew::Homebrew cask update skipped (no HOMEBREW_TAP_TOKEN secret)"
            exit 0
          fi

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          sums=$(GH_TOKEN="$RELEASE_TOKEN" gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --output -)
          # The archive name reaches awk through the environment rather than
          # `awk -v`, which would expand backslash escapes in it.
          digest() {
            ASSET="$CASK-$tag-$1-apple-darwin.tar.gz" awk '$2 == ENVIRON["ASSET"] { print $1 }' <<<"$sums"
          }
          sha_arm=$(digest aarch64)
          sha_intel=$(digest x86_64)
          for arch in aarch64 x86_64; do
            if [ "$arch" = aarch64 ]; then sha256=$sha_arm; else sha256=$sha_intel; fi
            if ! grep -qxE '[0-9a-f]{64}' <<<"$sha256"; then
              echo "::error title=homebrew::SHA256SUMS of $tag has no line for $CASK-$tag-$arch-apple-darwin.tar.gz"
              exit 1
            fi
          done

          gh auth setup-git
          git clone --quiet https://github.com/xcomart/homebrew-tap.git tap
          cd tap
          file="Casks/$CASK.rb"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$file")
          if [ "$current" = "$version" ]; then
            echo "$CASK is already at $version in the tap; nothing to update"
            exit 0
          fi
          if [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::warning title=homebrew::the tap already has $CASK $current, newer than $version; left as it is"
            exit 0
          fi

          # The head of the cask is written whole, from `cask ... do` to the
          # `url` line, rather than edited a line at a time. That is also what
          # turns a cask from before the Intel build -- one sha256 and
          # `depends_on arch: :arm64` -- into the two-architecture form.
          #
          # The minimum macOS is declared as well, as Big Sur: the bundle's
          # LSMinimumSystemVersion (packaging/macos/Info.plist) is 11.0. On Apple
          # Silicon that is the floor anyway, but `brew audit` on an Intel Mac
          # fails a cask whose bundle names a minimum the cask does not. It is
          # written `macos: :big_sur`, which `brew style` reads as a minimum
          # (Homebrew/OSDependsOn); the `">= :big_sur"` string earlier releases
          # wrote fails that check and is rewritten too.
          CASK_FILE="$file" VERSION="$version" SHA_ARM="$sha_arm" SHA_INTEL="$sha_intel" python3 - <<'PY'
          import os, re

          path, cask = os.environ["CASK_FILE"], os.environ["CASK"]
          repo = os.environ["GITHUB_REPOSITORY"]
          with open(path) as f:
              text = f.read()
          head = (
              '  arch arm: "aarch64", intel: "x86_64"\n'
              "\n"
              f'  version "{os.environ["VERSION"]}"\n'
              f'  sha256 arm:   "{os.environ["SHA_ARM"]}",\n'
              f'         intel: "{os.environ["SHA_INTEL"]}"\n'
              "\n"
              f'  url "https://github.com/{repo}/releases/download/v#{{version}}/'
              f'{cask}-v#{{version}}-#{{arch}}-apple-darwin.tar.gz"\n'
          )
          text, found = re.subn(
              r'(?ms)^(cask "[^"\n]+" do\n).*?^  url "[^"\n]*"\n',
              lambda match: match.group(1) + head,
              text,
              count=1,
          )
          if not found:
              raise SystemExit(f"::error title=homebrew::{path} has no url stanza to rewrite")
          text = re.sub(r'(?m)^  depends_on arch: :arm64\n', '', text)
          text = re.sub(r'(?m)^  depends_on (?::macos|macos: ">= :big_sur")$', '  depends_on macos: :big_sur', text)
          text = text.replace('-aarch64-apple-darwin/', '-#{arch}-apple-darwin/')
          with open(path, 'w') as f:
              f.write(text)
          PY
          git diff
          # Set on the clone rather than per command: a rebase below replays
          # this commit and needs a committer identity of its own.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "chore: update $CASK to $version"

          # The three applications release minutes apart and each touches a
          # cask of its own, so a rejected push only needs a rebase.
          for _ in 1 2 3; do
            if git push --quiet origin HEAD:main; then
              echo "pushed $CASK $version to xcomart/homebrew-tap"
              exit 0
            fi
            git pull --quiet --rebase origin main
          done
          echo "::error title=homebrew::could not push $CASK $version to xcomart/homebrew-tap"
          exit 1
