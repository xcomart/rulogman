[package]
name = "gpui_linux"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autoexamples = false
autotests = false
autobenches = false

[package.metadata.cargo-shear]
ignored = ["bitflags", "scap", "x11-clipboard"]

[lib]
path = "src/gpui_linux.rs"

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
wayland = [
    "bitflags",
    "gpui_wgpu",
    "ashpd/wayland",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon/wayland",
    "open",
    "gpui/wayland",
]
x11 = [
    "gpui_wgpu",
    "ashpd",
    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon/x11",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = ["gpui/screen-capture", "scap"]

[target."cfg(any(target_os = \"linux\", target_os = \"freebsd\"))".dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_unix = { version = "0.21.0" }
anyhow = { version = "1.0.86" }
bytemuck = "1"
collections = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", package = "collections" }
futures = { version = "0.3.32" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", package = "gpui", default-features = false }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", package = "gpui_util" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", package = "gpui_wgpu", optional = true, features = ["font-kit"] }
http_client = { git = "https://github.com/zed-industries/zed", rev = "fd82517a115d97a07835b52f0512b22b38e38ccf", package = "http_client" }
libc = { version = "0.2" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = { version = "0.12.1" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = { version = "2.0" }
strum = { version = "0.27.2", features = ["derive"] }
url = { version = "2.2" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
calloop = "0.14.3"
notify-rust = { version = "4" }
raw-window-handle = { version = "0.6" }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "notification", "open_uri", "file_chooser", "settings", "trash"], optional = true }
bitflags = { version = "2.6.0", optional = true }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }
xkbcommon = { version = "0.8.0", default-features = false, optional = true }
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed", optional = true }
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.15", features = ["client_system", "dlopen"], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"], optional = true }
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
    "dri3",
], optional = true }
xim = { git = "https://github.com/zed-industries/xim-rs.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8", features = ["x11rb-xcb", "x11rb-client"], package = "zed-xim", version = "0.4.0-zed", optional = true }
x11-clipboard = { version = "0.9.3", optional = true }

[lints.rust.unexpected_cfgs]
level = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lints.clippy.style]
level = "allow"
priority = -1
